name: Fenice Unica Nov 4-6 PAPER Recovery

# Temporary fail-closed fallback for the three-session technical pilot.
# Does not modify any V8/V6/V7 ledger or the approved pinned V8 core.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fenice-unica-nov4-6-recovery.yml"
      - "scripts/check-v8-pilot-recovery.mjs"
      - "scripts/test-v8-pilot-recovery.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 17 4-6 11 *"
    - cron: "17 19 4-6 11 *"

permissions:
  contents: read

jobs:
  conditional-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout only current repository files (no secrets)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Regression - locked baseline, date, risk, and audit-proof gates
        run: node scripts/test-v8-pilot-recovery.mjs
      - name: Check whether V8 needs an open-session prospective sample or day
        id: gate
        run: node scripts/check-v8-pilot-recovery.mjs
      - name: Reuse existing approved PAPER lab, only when V8 evidence is missing
        if: github.event_name != 'pull_request' && steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Requesting existing V8 PAPER laboratory; live/broker trading remains locked."
          gh workflow run paper-execution-lab.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Nothing to recover safely
        if: steps.gate.outputs.needed != 'true'
        run: echo "No dispatch. Either all evidence exists or the prospective market/approval window is closed."

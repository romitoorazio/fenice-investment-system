name: Fenice Production Deploy

on:
  push:
    branches: [main]
    paths:
      - ".ops/vercel-deploy-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fenice-vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TEAM_ID: team_qi2mFTw4tEjq6x5zWqDyjNDP
      VERCEL_PROJECT_ID: prj_KuTRkfN5G5cSMkqOaH5xlEV1K5By
      VERCEL_PROJECT_NAME: fenice-investment-system
      VERCEL_PRODUCTION_ALIAS: fenice-investment-system.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate guarded deploy request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch is dry-run only. Production deployment requires the guarded request file."
            exit 0
          fi

          test -f .ops/vercel-deploy-request.json
          EXECUTE="$(jq -r '.execute // false' .ops/vercel-deploy-request.json)"
          PROJECT="$(jq -r '.project // ""' .ops/vercel-deploy-request.json)"
          TARGET="$(jq -r '.target // ""' .ops/vercel-deploy-request.json)"
          CONFIRM="$(jq -r '.confirmation // ""' .ops/vercel-deploy-request.json)"

          if [[ "$EXECUTE" != "true" || "$PROJECT" != "fenice-investment-system" || "$TARGET" != "production" || "$CONFIRM" != "DEPLOY_LATEST_MAIN_TO_FENICE" ]]; then
            echo "Guard values are not valid. Refusing production deployment."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Refusing deployment from non-main branch: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "execute=true" >> "$GITHUB_OUTPUT"

      - name: Require Vercel token
        if: steps.request.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "Missing GitHub Actions secret VERCEL_TOKEN. Nothing deployed."
            exit 1
          fi

      - name: Create exact Fenice production deployment through Vercel API
        if: steps.request.outputs.execute == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          BODY="$(jq -n \
            --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg sha "$GITHUB_SHA" \
            '{
              name: $name,
              project: $project,
              target: "production",
              withLatestCommit: true,
              gitSource: {
                type: "github",
                org: "romitoorazio",
                repo: "fenice-investment-system",
                ref: "main"
              },
              gitMetadata: {
                remoteUrl: "https://github.com/romitoorazio/fenice-investment-system",
                commitRef: "main",
                commitSha: $sha,
                dirty: "false",
                ci: "true",
                ciType: "github-actions"
              },
              meta: {
                githubCommitSha: $sha,
                githubCommitRef: "main",
                deploymentReason: "guarded-fenice-production-refresh"
              }
            }')"

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error \
            -o "$RESPONSE_FILE" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_TEAM_ID}")"

          if [[ ! "$HTTP_CODE" =~ ^2 ]]; then
            echo "Vercel deployment creation failed (HTTP $HTTP_CODE):"
            cat "$RESPONSE_FILE"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          DEPLOYMENT_ID="$(jq -r '.id // .uid // empty' "$RESPONSE_FILE")"
          DEPLOYMENT_URL="$(jq -r '.url // empty' "$RESPONSE_FILE")"
          RESPONSE_PROJECT="$(jq -r '.projectId // .project.id // empty' "$RESPONSE_FILE")"

          if [[ ! "$DEPLOYMENT_ID" =~ ^dpl_ ]]; then
            echo "Vercel did not return a valid deployment id:"
            cat "$RESPONSE_FILE"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          if [[ -n "$RESPONSE_PROJECT" && "$RESPONSE_PROJECT" != "$VERCEL_PROJECT_ID" ]]; then
            echo "Deployment was created for an unexpected Vercel project: $RESPONSE_PROJECT"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created Fenice deployment: $DEPLOYMENT_ID ($DEPLOYMENT_URL)"
          rm -f "$RESPONSE_FILE"

      - name: Wait for Fenice deployment to become READY
        if: steps.request.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ID="${{ steps.deploy.outputs.deployment_id }}"

          for attempt in $(seq 1 90); do
            RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/${ID}?teamId=${VERCEL_TEAM_ID}")"

            STATE="$(printf '%s' "$RESPONSE" | jq -r '.readyState // .state // .status // "UNKNOWN"')"
            echo "Deployment $ID state: $STATE (attempt $attempt/90)"

            if [[ "$STATE" == "READY" ]]; then
              exit 0
            fi

            if [[ "$STATE" == "ERROR" || "$STATE" == "CANCELED" || "$STATE" == "CANCELLED" ]]; then
              echo "Deployment entered terminal failure state: $STATE"
              printf '%s' "$RESPONSE" | jq .
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Fenice deployment to become READY."
          exit 1

      - name: Verify production alias points to the new Fenice deployment
        if: steps.request.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.deploy.outputs.deployment_id }}"

          for attempt in $(seq 1 24); do
            RESPONSE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/${VERCEL_PRODUCTION_ALIAS}?teamId=${VERCEL_TEAM_ID}&projectId=${VERCEL_PROJECT_ID}")"

            CURRENT="$(printf '%s' "$RESPONSE" | jq -r '.deploymentId // empty')"
            RESPONSE_PROJECT="$(printf '%s' "$RESPONSE" | jq -r '.projectId // empty')"
            echo "Production alias points to: $CURRENT (attempt $attempt/24)"

            if [[ "$CURRENT" == "$EXPECTED" && "$RESPONSE_PROJECT" == "$VERCEL_PROJECT_ID" ]]; then
              echo "Fenice production alias verified: $CURRENT"
              exit 0
            fi

            sleep 5
          done

          echo "Production alias did not move to expected deployment $EXPECTED."
          exit 1

      - name: Verify public Fenice UI is the new broker-aware build
        if: steps.request.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(curl --fail --silent --show-error --location "https://${VERCEL_PRODUCTION_ALIAS}/")"

          if ! grep -Fq "Broker scelto: Directa SIM" <<< "$HTML"; then
            echo "New Directa broker state was not found in production HTML."
            exit 1
          fi

          if grep -Fq "Scegliere banca o broker" <<< "$HTML"; then
            echo "Old broker-selection UI is still present after deployment."
            exit 1
          fi

          echo "Production UI verified: Directa SIM selected; obsolete broker-selection text absent."

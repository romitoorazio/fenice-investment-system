name: Fenice DCF Valuation

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/run-dcf-engine.mjs"
      - "lib/dcf.ts"
      - "lib/dcf-runtime.ts"
      - "components/DcfEngine.tsx"
      - "app/api/dcf/**"
      - "app/valuation/**"
      - "data/fundamental-research.json"
      - "data/terminal-intelligence.json"
      - "package.json"
      - ".github/workflows/valuation.yml"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Build DCF scenarios
        run: npm run dcf

      - name: Validate DCF report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/dcf-analysis.json', 'utf8'));
          if (!Array.isArray(d.companies) || !Number.isFinite(d.coveragePercent) || !d.source) process.exit(1);
          if (d.companyCount < 8 || d.availableCount < 4) process.exit(1);
          for (const c of d.companies.filter((x) => x.status === 'disponibile')) {
            if (!Array.isArray(c.scenarios) || c.scenarios.length !== 3 || !Number.isFinite(c.fairValueBase) || !Number.isFinite(c.confidence)) process.exit(1);
            if (!c.robustness || !Array.isArray(c.robustness.sensitivityCells) || c.robustness.sensitivityCells.length !== 9) process.exit(1);
            if (!Number.isFinite(c.robustness.supportingCells) || !Number.isFinite(c.robustness.totalCells) || c.robustness.totalCells !== 9) process.exit(1);
            if (!Number.isFinite(c.robustness.supportPercent) || !Number.isFinite(c.robustness.fairValueMin) || !Number.isFinite(c.robustness.fairValueMedian) || !Number.isFinite(c.robustness.fairValueMax)) process.exit(1);
            if (!['BASSA FRAGILITÀ', 'MEDIA FRAGILITÀ', 'ALTA FRAGILITÀ'].includes(c.robustness.state)) process.exit(1);
          }
          console.log('DCF companies:', d.companyCount, 'available', d.availableCount, 'coverage', d.coveragePercent, 'robustness=validated');
          NODE

      - name: Commit DCF analysis
        run: |
          if git diff --quiet -- data/dcf-analysis.json; then
            echo "No DCF changes to commit"
            exit 0
          fi

          git config user.name "fenice-valuation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          temp_dir="$(mktemp -d)"
          cp data/dcf-analysis.json "$temp_dir/dcf-analysis.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$temp_dir/dcf-analysis.json" data/dcf-analysis.json
            git add data/dcf-analysis.json

            if git diff --cached --quiet; then
              echo "DCF analysis already published"
              exit 0
            fi

            git commit -m "Update Fenice DCF analysis"
            if git push origin HEAD:main; then
              echo "DCF analysis published"
              exit 0
            fi

            echo "Push attempt $attempt failed because main advanced; retrying"
            sleep $((attempt * 2))
          done

          echo "Unable to publish DCF analysis after 3 attempts"
          exit 1

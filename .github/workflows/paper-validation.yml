name: Fenice Paper Validation

on:
  workflow_dispatch:
  schedule:
    # 16:35 UTC keeps the recurring validation inside the regular US equity session
    # in both daylight-saving and standard-time periods. Weekend runs remain useful
    # as no-risk safety evidence and must naturally fail closed on stale quotes.
    - cron: "35 16 * * *"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FENICE_JOB: intraday
      FENICE_TWELVE_DATA_EXECUTION_PROBES: "3"
      FENICE_ALPHA_VANTAGE_EXECUTION_PROBES: "0"
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Check campaign state
        id: campaign
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const campaign = JSON.parse(fs.readFileSync('data/paper-validation-campaign.json', 'utf8'));
          const fingerprint = campaign?.baselineFingerprint;
          const started = Boolean(
            campaign?.startedAt
            && campaign?.baselineCommit
            && campaign?.liveTradingAllowed === false
            && fingerprint?.complete === true
            && fingerprint?.algorithm === 'sha256'
            && /^[a-f0-9]{64}$/i.test(String(fingerprint?.digest || ''))
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `started=${started}\n`);
          console.log(started ? 'Paper validation campaign active with immutable core fingerprint' : 'Paper validation campaign not started/invalid baseline; no evidence will be written');
          NODE

      - name: Refresh critical source health for decision-data gate
        if: steps.campaign.outputs.started == 'true'
        run: npm run sources:check

      - name: Build fresh intelligence quality for decision-data gate
        if: steps.campaign.outputs.started == 'true'
        run: node scripts/run-intelligence.mjs

      - name: Assess daily decision-data gate
        if: steps.campaign.outputs.started == 'true'
        id: decision_data
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const sources = JSON.parse(fs.readFileSync('data/global-source-health.json', 'utf8'));
          const intelligence = JSON.parse(fs.readFileSync('data/intelligence-quality.json', 'utf8'));
          const now = Date.now();
          const ageMinutes = (value) => {
            const parsed = Date.parse(String(value || ''));
            return Number.isFinite(parsed) ? (now - parsed) / 60000 : Infinity;
          };
          const sourceAge = ageMinutes(sources.generatedAt);
          const intelligenceAge = ageMinutes(intelligence.generatedAt);
          const criticalReady = Number(sources?.critical?.ready || 0);
          const criticalTotal = Number(sources?.critical?.total || 0);
          const sourceReady = sourceAge >= 0 && sourceAge <= 10
            && sources?.critical?.gate === 'GREEN'
            && criticalTotal > 0
            && criticalReady === criticalTotal;
          const dataReady = intelligenceAge >= 0 && intelligenceAge <= 10
            && Number(intelligence?.intelligenceConfidence || 0) >= 90
            && Number(intelligence?.coverage?.sourceConcentrationPercent ?? 100) <= 50
            && Number(intelligence?.coverage?.marketSources || 0) >= 3
            && Array.isArray(intelligence?.coverage?.assetClasses)
            && intelligence.coverage.assetClasses.length >= 3
            && Number(intelligence?.crossSourceValidation?.checked || 0) >= 10
            && Number(intelligence?.crossSourceValidation?.divergent || 0) === 0
            && intelligence?.policy?.unknownTimestampEvidenceExcluded === true;
          const ready = sourceReady && dataReady;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          console.log(`Daily decision-data gate: ${ready ? 'PASS' : 'BLOCK'}; sources=${criticalReady}/${criticalTotal}; confidence=${Number(intelligence?.intelligenceConfidence || 0)}; checks=${Number(intelligence?.crossSourceValidation?.checked || 0)}; divergence=${Number(intelligence?.crossSourceValidation?.divergent || 0)}; concentration=${Number(intelligence?.coverage?.sourceConcentrationPercent ?? 100)}.`);
          NODE

      - name: Refresh independent execution market evidence
        if: steps.campaign.outputs.started == 'true'
        run: npm run marketdata:execution

      - name: Refresh per-symbol PAPER execution coverage
        if: steps.campaign.outputs.started == 'true'
        run: node --experimental-strip-types scripts/check-execution-market-coverage.mjs

      - name: Exercise PAPER-only OMS
        if: steps.campaign.outputs.started == 'true' && steps.decision_data.outputs.ready == 'true'
        run: |
          npm run paper:conditional
          npm run paper:run

      - name: Confirm fail-closed no-risk day
        if: steps.campaign.outputs.started == 'true' && steps.decision_data.outputs.ready != 'true'
        run: echo "Decision-data gate blocked new PAPER risk; OMS execution intentionally skipped."

      - name: Record daily validation evidence
        if: steps.campaign.outputs.started == 'true'
        run: npm run paper:validation:record

      - name: Inspect campaign status
        if: steps.campaign.outputs.started == 'true'
        run: npm run paper:validation:status

      - name: Publish paper validation evidence
        if: steps.campaign.outputs.started == 'true'
        run: |
          git config user.name "fenice-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          cp data/paper-validation-campaign.json "$generated_dir/paper-validation-campaign.json"
          cp data/paper-oms-state.json "$generated_dir/paper-oms-state.json"
          cp data/paper-order-queue.json "$generated_dir/paper-order-queue.json"
          cp data/paper-conditional-state.json "$generated_dir/paper-conditional-state.json"
          cp data/paper-conditional-queue.json "$generated_dir/paper-conditional-queue.json"
          cp data/execution-market-evidence.json "$generated_dir/execution-market-evidence.json"
          cp data/execution-market-coverage.json "$generated_dir/execution-market-coverage.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/paper-validation-campaign.json" data/paper-validation-campaign.json
            cp "$generated_dir/paper-oms-state.json" data/paper-oms-state.json
            cp "$generated_dir/paper-order-queue.json" data/paper-order-queue.json
            cp "$generated_dir/paper-conditional-state.json" data/paper-conditional-state.json
            cp "$generated_dir/paper-conditional-queue.json" data/paper-conditional-queue.json
            cp "$generated_dir/execution-market-evidence.json" data/execution-market-evidence.json
            cp "$generated_dir/execution-market-coverage.json" data/execution-market-coverage.json
            git add data/paper-validation-campaign.json data/paper-oms-state.json data/paper-order-queue.json data/paper-conditional-state.json data/paper-conditional-queue.json data/execution-market-evidence.json data/execution-market-coverage.json

            if git diff --cached --quiet; then
              echo "No paper validation changes to commit"
              exit 0
            fi

            git commit -m "data: record Fenice paper validation evidence"
            if git push origin HEAD:main; then
              echo "Paper validation evidence published"
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish paper validation evidence after 3 attempts"
          exit 1

name: Fenice World Market Collection

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/world-market-collection.yml"
      - "scripts/collect-world-market-observations.mjs"
      - "scripts/test-world-market-observations.mjs"
      - "lib/market/world-v7-provider-probe.mjs"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/test-world-market-observations.mjs

  observe:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: fenice-world-market-observation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Load latest main-branch catalogue and diagnostic history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in world-equity-research-references world-market-observation; do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact&per_page=30" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | max_by(.created_at).workflow_run.id // empty')
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then
              gh run download "$run_id" --name "$artifact" --dir "$RUNNER_TEMP/$artifact"
            fi
          done
      - name: Observe all reported sessions and rotate quote checks by venue
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          node scripts/collect-world-market-observations.mjs \
            "$RUNNER_TEMP/world-equity-research-references/fenice-world-equity-references.json" \
            "$RUNNER_TEMP/world-market-observation/world-market-observation.json" \
            "$RUNNER_TEMP/world-market-observation.json"
      - name: Retain market diagnostics without provider prices
        uses: actions/upload-artifact@v4
        with:
          name: world-market-observation
          path: ${{ runner.temp }}/world-market-observation.json
          retention-days: 3
          if-no-files-found: error

name: Fenice PAPER Core Freeze Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  protect-paper-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inspected revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check active PAPER fingerprint against inspected revision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

          node - <<'NODE'
          const { execFileSync } = require('node:child_process');

          const eventName = String(process.env.EVENT_NAME || '').trim();
          const beforeSha = String(process.env.BEFORE_SHA || '').trim();
          const readGitText = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const tryGitText = (args) => {
            try {
              return readGitText(args);
            } catch {
              return '';
            }
          };
          const readCampaignAt = (ref) => {
            const text = tryGitText(['show', `${ref}:data/paper-validation-campaign.json`]);
            if (!text) return null;
            try {
              return JSON.parse(text);
            } catch {
              throw new Error(`PAPER_CORE_FREEZE_GUARD: invalid campaign JSON at ${ref}`);
            }
          };
          const isActive = (campaign) => Boolean(
            campaign?.startedAt
            && campaign?.baselineCommit
            && campaign?.baselineFingerprint?.complete === true
            && Array.isArray(campaign?.baselineFingerprint?.files)
            && campaign.baselineFingerprint.files.length > 0
            && campaign?.liveTradingAllowed === false
          );

          let campaign;
          let campaignSource;
          if (eventName === 'pull_request') {
            campaign = readCampaignAt('origin/main');
            campaignSource = 'origin/main';
          } else {
            campaign = readCampaignAt('HEAD');
            campaignSource = 'HEAD';
            if (!isActive(campaign) && /^[0-9a-f]{40}$/i.test(beforeSha)) {
              const previous = readCampaignAt(beforeSha);
              if (isActive(previous)) {
                campaign = previous;
                campaignSource = beforeSha;
              }
            }
          }

          if (!isActive(campaign)) {
            console.log('PAPER core freeze guard: no active certifying baseline; PASS.');
            process.exit(0);
          }

          const baselineCommit = String(campaign.baselineCommit).trim();
          const frozenCore = [...new Set(campaign.baselineFingerprint.files.map((file) => String(file).trim()).filter(Boolean))];
          const baselineExists = tryGitText(['cat-file', '-t', baselineCommit]) === 'commit';
          if (!baselineExists) {
            throw new Error(`PAPER_CORE_FREEZE_GUARD: baseline commit ${baselineCommit} is not available`);
          }

          const drift = [];
          for (const file of frozenCore) {
            const baselineBlob = tryGitText(['rev-parse', `${baselineCommit}:${file}`]);
            const inspectedBlob = tryGitText(['rev-parse', `HEAD:${file}`]);
            if (!baselineBlob || !inspectedBlob || baselineBlob !== inspectedBlob) {
              drift.push({ file, baselineBlob: baselineBlob || 'MISSING', inspectedBlob: inspectedBlob || 'MISSING' });
            }
          }

          console.log(
            `PAPER core freeze guard: V${campaign.version || '?'} baseline active since ${campaign.startedAt}; `
            + `campaignSource=${campaignSource}; fingerprinted files=${frozenCore.length}; drift=${drift.length}.`,
          );

          if (drift.length > 0) {
            console.error('PAPER_CORE_DRIFT: inspected revision differs from the active certifying baseline:');
            for (const row of drift) console.error(` - ${row.file}: baseline=${row.baselineBlob} inspected=${row.inspectedBlob}`);
            console.error('Retire/restart the PAPER baseline deliberately before accepting a core change. Do not silently mutate the active certification surface.');
            process.exit(1);
          }

          console.log(`PAPER core freeze guard: active fingerprint matches baseline ${baselineCommit.slice(0, 12)}; PASS.`);
          NODE

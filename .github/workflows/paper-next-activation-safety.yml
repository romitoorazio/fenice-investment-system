name: Fenice PAPER Next Activation Safety

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/paper-next-activation-safety.yml"
      - "scripts/paper-next-activation-preflight.mjs"
      - "scripts/test-paper-next-activation-preflight.mjs"
      - "scripts/paper-next-fingerprint.mjs"
      - "scripts/test-paper-next-fingerprint.mjs"

permissions:
  contents: read

concurrency:
  group: fenice-paper-next-activation-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-next-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test isolated PAPER-only activation gates
        run: node scripts/test-paper-next-activation-preflight.mjs
      - name: Test independent PAPER-next SHA256 fingerprint
        run: node scripts/test-paper-next-fingerprint.mjs

name: Fenice PAPER Provider Feasibility Lab

on:
  workflow_dispatch:
  # A completed canonical PAPER session is a second genuine in-session
  # opportunity when GitHub silently delays/omits the provider lab cron.
  workflow_run:
    workflows: ["Fenice Paper Validation"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "12 15 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-provider-feasibility.yml"
      - "lib/trading/paper-v7-probe-selection.mjs"
      - "scripts/probe-paper-provider-feasibility.mjs"
      - "lib/intelligence/paper-provider-probe-truth.mjs"
      - "scripts/test-paper-provider-probe-truth.mjs"
      - "scripts/test-paper-provider-probe-integration.mjs"
      - "lib/market/alpaca-paper-clock-runtime.mjs"
      - "lib/trading/paper-timestamp-integrity.ts"
      - "scripts/plan-paper-v7-probe-priority.mjs"
      - "scripts/test-paper-v7-probe-priority.mjs"
      - "scripts/test-paper-v7-provider-trigger.mjs"
      - "scripts/plan-paper-v7-probe-universe.mjs"
      - "scripts/test-paper-v7-probe-universe.mjs"
      - "scripts/test-paper-v7-probe-selection.mjs"
  pull_request:
    paths:
      - ".github/workflows/paper-provider-feasibility.yml"
      - "lib/trading/paper-v7-probe-selection.mjs"
      - "scripts/probe-paper-provider-feasibility.mjs"
      - "lib/intelligence/paper-provider-probe-truth.mjs"
      - "scripts/test-paper-provider-probe-truth.mjs"
      - "scripts/test-paper-provider-probe-integration.mjs"
      - "lib/market/alpaca-paper-clock-runtime.mjs"
      - "lib/trading/paper-timestamp-integrity.ts"
      - "scripts/plan-paper-v7-probe-priority.mjs"
      - "scripts/test-paper-v7-probe-priority.mjs"
      - "scripts/test-paper-v7-provider-trigger.mjs"
      - "scripts/plan-paper-v7-probe-universe.mjs"
      - "scripts/test-paper-v7-probe-universe.mjs"
      - "scripts/test-paper-v7-probe-selection.mjs"

permissions:
  contents: write

concurrency:
  group: paper-provider-feasibility
  # Never discard a started observation simply because two safe triggers
  # collide. A queued attempt must still check the authoritative market clock.
  cancel-in-progress: false

jobs:
  provider-feasibility:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.name == 'Fenice Paper Validation' &&
       (github.event.workflow_run.event == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Cover the four active PAPER probe symbols before three V7 candidates.
      # Seven symbols preserve the existing Basic credit ceiling.
      FENICE_FEASIBILITY_SYMBOLS: "SPY,QQQ,AAPL,MSFT,ASML,TSM,NVDA"
      FENICE_PROVIDER_FEASIBILITY_REPORT: data/v7-provider-feasibility.json
      FENICE_V7_PROBE_PLAN: data/v7-probe-plan.json
      FENICE_V7_PROBE_UNIVERSE_PLAN: data/v7-probe-universe.json
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout exactly the code under review or current main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify strict provider timestamps and IEX fallback
        run: node --experimental-strip-types scripts/test-paper-provider-probe-truth.mjs
      - name: Verify closed-session zero-quote budget and report-time freshness
        run: node --experimental-strip-types scripts/test-paper-provider-probe-integration.mjs
      - name: Probe read-only provider feasibility
        if: github.event_name != 'pull_request'
        run: node --experimental-strip-types scripts/probe-paper-provider-feasibility.mjs

      - name: Regression-test inactive V7 planner, including stale/closed market fail-closed
        run: node scripts/test-paper-v7-probe-priority.mjs

      - name: Validate canonical workflow event provenance and cron fallback
        run: node scripts/test-paper-v7-provider-trigger.mjs

      - name: Regression-test fail-closed V7 probe selector
        run: node scripts/test-paper-v7-probe-selection.mjs

      - name: Regression-test inactive V7 adaptive universe
        run: node scripts/test-paper-v7-probe-universe.mjs

      - name: Build inactive V7 probe priority plan
        if: github.event_name != 'pull_request'
        run: node scripts/plan-paper-v7-probe-priority.mjs

      - name: Build inactive V7 adaptive probe universe
        if: github.event_name != 'pull_request'
        run: node scripts/plan-paper-v7-probe-universe.mjs

      - name: Verify V6 isolation
        if: github.event_name != 'pull_request'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const feasibility = JSON.parse(fs.readFileSync('data/v7-provider-feasibility.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync('data/v7-probe-plan.json', 'utf8'));
          const universe = JSON.parse(fs.readFileSync('data/v7-probe-universe.json', 'utf8'));

          if (feasibility.diagnosticOnly !== true
            || feasibility.paperStateModified !== false
            || feasibility.campaignEvidenceModified !== false
            || feasibility.brokerConnectivityAllowed !== false
            || feasibility.liveTradingAllowed !== false) {
            throw new Error('Provider feasibility lab is not safely isolated');
          }
          if (plan.plannedForVersion !== 7
            || plan.activationAllowed !== false
            || plan.currentV6Modified !== false
            || plan.liveTradingAllowed !== false) {
            throw new Error('V7 probe priority plan is not safely isolated');
          }
          if (universe.plannedForVersion !== 7
            || universe.activationAllowed !== false
            || universe.currentV6Modified !== false
            || universe.liveTradingAllowed !== false
            || universe.currentV6?.protectedBaseVerified !== true
            || universe.currentV6?.protectedProbeLimitVerified !== true) {
            throw new Error('V7 probe universe plan is not safely isolated');
          }
          console.log(
            'V7 provider lab isolation valid:',
            'compatible=', feasibility.quorumCompatibleSymbols?.join(',') || 'none',
            'priority=', plan.recommendedExpansionOrder?.join(',') || 'none',
            'planned=', universe.futureV7?.plannedTwelveDataSymbols?.join(',') || 'none',
          );
          NODE

      - name: Upload provider feasibility and V7 plans
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: paper-provider-feasibility-${{ github.run_id }}
          path: |
            data/v7-provider-feasibility.json
            data/v7-probe-plan.json
            data/v7-probe-universe.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish only V7 provider planning evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fenice-v7-provider-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          cp data/v7-provider-feasibility.json "$generated_dir/feasibility.json"
          cp data/v7-probe-plan.json "$generated_dir/plan.json"
          cp data/v7-probe-universe.json "$generated_dir/universe.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/feasibility.json" data/v7-provider-feasibility.json
            cp "$generated_dir/plan.json" data/v7-probe-plan.json
            cp "$generated_dir/universe.json" data/v7-probe-universe.json
            git add data/v7-provider-feasibility.json data/v7-probe-plan.json data/v7-probe-universe.json

            if git diff --cached --quiet; then
              echo "No V7 provider planning changes to commit"
              exit 0
            fi

            git commit -m "data: refresh V7 provider feasibility planning"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish V7 provider planning after retries"
          exit 1

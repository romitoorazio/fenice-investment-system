name: Fenice Robust Strategy Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/run-strategy-lab.mjs"
      - "lib/strategy.ts"
      - "components/StrategyLab.tsx"
      - "app/api/strategies/**"
      - "app/strategies/**"
      - "package.json"
      - ".github/workflows/strategies.yml"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run out of sample strategy tests
        run: npm run strategies

      - name: Validate strategy report
        run: |
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('data/strategy-lab.json'));if(!Array.isArray(s.assets)||!Number.isFinite(s.coveragePercent)||!s.source)process.exit(1);if(s.assetCount<12||s.coveragePercent<60)process.exit(1);for(const a of s.assets){if(!Array.isArray(a.families)||a.families.length!==2||!Number.isFinite(a.bestRobustnessScore))process.exit(1);for(const f of a.families){if(!Array.isArray(f.variants)||f.variants.length!==3)process.exit(1);for(const v of f.variants){if(!v.inSample||!v.outOfSample||!v.fullPeriod)process.exit(1)}}};console.log('Strategy assets:',s.assetCount,'coverage',s.coveragePercent,'robust',s.robustCount)"

      - name: Commit strategy analysis
        run: |
          git config user.name "fenice-strategy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_file="$(mktemp)"
          cp data/strategy-lab.json "$generated_file"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_file" data/strategy-lab.json
            git add data/strategy-lab.json

            if git diff --cached --quiet; then
              echo "No strategy changes to commit"
              exit 0
            fi

            git commit -m "Update Fenice strategy robustness"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish strategy analysis after 3 attempts"
          exit 1

name: Fenice PAPER V6 Campaign Observer

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      # Canonical daily validation is the source of truth for campaign days.
      # Probe-only listening missed ordinary days with no qualifying signal.
      - Fenice Paper Validation
      - Fenice PAPER Validation Probe Cycle
    types:
      - completed
  schedule:
    # Read-only every calendar day. The original campaign matures Sunday
    # 2026-10-25T15:40:35Z; a weekdays-only cron would miss that deadline.
    # 21:15 UTC remains safely after cash close in both US DST regimes.
    - cron: "15 21 * * *"
  pull_request:
    branches:
      - main
    paths:
      - "lib/intelligence/paper-campaign-runway.mjs"
      - "scripts/test-paper-v6-campaign-runway.mjs"
      - "scripts/test-paper-v6-observer-orchestration.mjs"
      - "scripts/report-paper-v6-progress.mjs"
      - "lib/intelligence/paper-v6-observer-integrity.mjs"
      - "scripts/test-paper-v6-observer-integrity.mjs"
      - ".github/workflows/paper-v6-campaign-observer.yml"
  push:
    paths:
      - "scripts/report-paper-v6-progress.mjs"
      - "lib/intelligence/paper-v6-observer-integrity.mjs"
      - "scripts/test-paper-v6-observer-integrity.mjs"
      - "scripts/test-paper-v6-observer-orchestration.mjs"
      - ".github/workflows/paper-v6-campaign-observer.yml"

permissions:
  contents: read

concurrency:
  group: fenice-paper-v6-campaign-observer-${{ github.ref }}
  # A Sunday checkpoint or successful canonical completion must never cancel
  # another observer mid-audit. Read-only overlap is safer than losing evidence.
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.name == 'Fenice Paper Validation' ||
        github.event.workflow_run.name == 'Fenice PAPER Validation Probe Cycle') &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inspected revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test PAPER V6 campaign runway
        run: node scripts/test-paper-v6-campaign-runway.mjs

      - name: Verify certified safe-day counts and expired queue quarantine
        run: node scripts/test-paper-v6-observer-integrity.mjs

      - name: Verify exact 30-day maturity checkpoint and trusted event provenance
        run: node scripts/test-paper-v6-observer-orchestration.mjs

      - name: Report PAPER V6 campaign and certification maturity
        env:
          FENICE_OBSERVER_REPORT_PATH: ${{ runner.temp }}/fenice-paper-v6-observer.json
        run: node scripts/report-paper-v6-progress.mjs

      - name: Publish machine-readable observer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenice-paper-v6-observer-${{ github.run_id }}
          path: ${{ runner.temp }}/fenice-paper-v6-observer.json
          if-no-files-found: error
          retention-days: 35

      - name: Confirm observer remains read-only
        if: always()
        run: |
          test -z "$(git status --porcelain)"
          echo "Observer completed without mutating repository state."

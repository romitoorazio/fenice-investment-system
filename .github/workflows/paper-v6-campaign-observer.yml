name: Fenice PAPER V6 Campaign Observer

on:
  workflow_dispatch:
  # Legacy V6 retired on 10 November 2026. Do not schedule or subscribe the
  # expired campaign to unrelated actions; retain explicit manual forensic
  # review with its real kill-switch alerts and original report intact.
  pull_request:
    branches:
      - main
    paths:
      - "lib/intelligence/paper-campaign-runway.mjs"
      - "scripts/test-paper-v6-campaign-runway.mjs"
      - "scripts/test-paper-v6-observer-orchestration.mjs"
      - "scripts/report-paper-v6-progress.mjs"
      - "lib/intelligence/paper-v6-observer-integrity.mjs"
      - "scripts/test-paper-v6-observer-integrity.mjs"
      - ".github/workflows/paper-v6-campaign-observer.yml"
  push:
    paths:
      - "scripts/report-paper-v6-progress.mjs"
      - "lib/intelligence/paper-v6-observer-integrity.mjs"
      - "scripts/test-paper-v6-observer-integrity.mjs"
      - "scripts/test-paper-v6-observer-orchestration.mjs"
      - ".github/workflows/paper-v6-campaign-observer.yml"

permissions:
  contents: read

concurrency:
  group: fenice-paper-v6-campaign-observer-${{ github.ref }}
  # Manual forensic checks and code regressions must not cancel one another.
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inspected revision without write credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate historical maturity and archive isolation policy
        run: |
          node scripts/test-paper-v6-campaign-runway.mjs
          node scripts/test-paper-v6-observer-integrity.mjs
          node scripts/test-paper-v6-observer-orchestration.mjs
          node scripts/test-one-global-legacy-retirement.mjs
          node scripts/scan-repository-secrets.mjs

  observe:
    # A manual historical audit may still fail on a real V6 kill switch:
    # never turn that historical red alert into a green certified PAPER day.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inspected revision
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test PAPER V6 campaign runway
        run: node scripts/test-paper-v6-campaign-runway.mjs

      - name: Verify certified safe-day counts and expired queue quarantine
        run: node scripts/test-paper-v6-observer-integrity.mjs

      - name: Verify exact 30-day historical maturity and manual-only archive policy
        run: node scripts/test-paper-v6-observer-orchestration.mjs

      - name: Report PAPER V6 campaign and certification maturity
        env:
          FENICE_OBSERVER_REPORT_PATH: ${{ runner.temp }}/fenice-paper-v6-observer.json
        run: node scripts/report-paper-v6-progress.mjs

      - name: Publish machine-readable observer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenice-paper-v6-observer-${{ github.run_id }}
          path: ${{ runner.temp }}/fenice-paper-v6-observer.json
          if-no-files-found: error
          retention-days: 35

      - name: Confirm observer remains read-only
        if: always()
        run: |
          test -z "$(git status --porcelain)"
          echo "Observer completed without mutating repository state."

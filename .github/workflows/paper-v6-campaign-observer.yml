name: Fenice PAPER V6 Campaign Observer

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fenice PAPER Validation Probe Cycle
    types:
      - completed
  schedule:
    # 21:15 UTC is after the US cash close in both DST and standard-time seasons.
    - cron: "15 21 * * 1-5"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/report-paper-v6-progress.mjs"
      - ".github/workflows/paper-v6-campaign-observer.yml"
  push:
    paths:
      - "scripts/report-paper-v6-progress.mjs"
      - ".github/workflows/paper-v6-campaign-observer.yml"

permissions:
  contents: read

concurrency:
  group: fenice-paper-v6-campaign-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inspected revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Report PAPER V6 campaign and certification maturity
        env:
          FENICE_OBSERVER_REPORT_PATH: ${{ runner.temp }}/fenice-paper-v6-observer.json
        run: node scripts/report-paper-v6-progress.mjs

      - name: Publish machine-readable observer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenice-paper-v6-observer-${{ github.run_id }}
          path: ${{ runner.temp }}/fenice-paper-v6-observer.json
          if-no-files-found: error
          retention-days: 35

      - name: Confirm observer remains read-only
        if: always()
        run: |
          test -z "$(git status --porcelain)"
          echo "Observer completed without mutating repository state."

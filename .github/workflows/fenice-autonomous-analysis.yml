name: Fenice Autonomous Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Run Fenice autonomous analysis
        run: npm run analyze

      - name: Validate generated snapshot
        run: |
          node -e 'const fs=require("fs"); const p="data/latest-snapshot.json"; const x=JSON.parse(fs.readFileSync(p,"utf8")); if(!x.generatedAt||!Array.isArray(x.markets)||!Array.isArray(x.discoveries)||!Array.isArray(x.providers)) process.exit(1); console.log(`Snapshot valido: ${x.markets.length} mercati, ${x.discoveries.length} eventi, ${x.providers.length} fonti`);'

      - name: Commit refreshed intelligence
        run: |
          git config user.name "Fenice Automation"
          git config user.email "actions@users.noreply.github.com"

          generated_file="$(mktemp)"
          cp data/latest-snapshot.json "$generated_file"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_file" data/latest-snapshot.json
            git add data/latest-snapshot.json

            if git diff --cached --quiet; then
              echo "Nessun cambiamento nei dati Fenice."
              exit 0
            fi

            git commit -m "data: refresh Fenice intelligence snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish autonomous snapshot after 3 attempts"
          exit 1

name: FENICE Global Daily Research Scheduler (research only)
on:
  push:
    paths:
      - ".github/workflows/fenice-global-daily-research.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1-5"
permissions:
  contents: write
concurrency:
  group: fenice-phase4-persistent-evidence
  cancel-in-progress: false
jobs:
  public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-global-integration-safety-reconcile-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare persistent research journal from dedicated evidence branch
        shell: bash
        run: |
          mkdir -p artifacts/phase4/persistent artifacts/phase5/persistent
          if git ls-remote --exit-code --heads origin fenice-phase4-evidence; then
            git fetch origin fenice-phase4-evidence
            git show FETCH_HEAD:journal.json > artifacts/phase4/persistent/journal.json
            if git cat-file -e FETCH_HEAD:phase5-virtual-ledger.json 2>/dev/null; then
              git show FETCH_HEAD:phase5-virtual-ledger.json > artifacts/phase5/persistent/ledger.json
            fi
            if git cat-file -e FETCH_HEAD:phase5-forward-ledger.json 2>/dev/null; then
              git show FETCH_HEAD:phase5-forward-ledger.json > artifacts/phase5/persistent/forward-ledger.json
            fi
          fi
      - name: Fetch public historical observations and publish research-only report
        env:
          FENICE_PHASE4_JOURNAL_PATH: artifacts/phase4/persistent/journal.json
          FENICE_PHASE5_LEDGER_PATH: artifacts/phase5/persistent/ledger.json
          FENICE_PHASE5_FORWARD_LEDGER_PATH: artifacts/phase5/persistent/forward-ledger.json
        run: node scripts/run-fenice-one-global-phase3-public-research.mjs
      - name: Validate phase 5 outputs before publication
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("artifacts/phase5/latest-historical-portfolio.json")); const l=JSON.parse(fs.readFileSync("artifacts/phase5/persistent/ledger.json")); if(p.liveTradingAllowed!==false||p.ordersGenerated!==0||!Array.isArray(p.trades)||l.liveTradingAllowed!==false||l.ordersGenerated!==0||!Array.isArray(l.journal)) process.exit(1); console.log(JSON.stringify({phase5:"VALIDATED_HISTORICAL_ONLY",trades:p.trades.length,ledgerEntries:l.journal.length,netPnlEuro:p.netPnlEuro}));'
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import {validatePhase5ForwardLedger} from "./lib/global/phase5-forward-research.mjs";
          const ledger=JSON.parse(readFileSync("artifacts/phase5/persistent/forward-ledger.json"));
          const summary=JSON.parse(readFileSync("artifacts/phase5/latest-forward-research-portfolio.json"));
          const state=validatePhase5ForwardLedger(ledger);
          if(summary.liveTradingAllowed!==false||summary.paperFillAuthorized!==false||summary.ordersGenerated!==0||
             summary.realPaperCertified!==false||summary.ledgerHeadHash!==ledger.headHash||
             summary.totalEvents!==ledger.entries.length||summary.openPositions.length!==state.accounting.openPositions.length||
             summary.cashEuro!==state.accounting.cashEuro||summary.realizedNetPnlEuro!==state.accounting.realizedNetPnlEuro)process.exit(1);
          console.log(JSON.stringify({phase5Forward:"VALIDATED_UNATTESTED_ONLY",events:ledger.entries.length,
            open:summary.openPositions.length,closed:summary.closedTrades,ordersGenerated:0}));
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const f=JSON.parse(readFileSync("artifacts/phase5/latest-forward-research-portfolio.json"));
          const r=JSON.parse(readFileSync("artifacts/phase6/latest-forward-risk-report.json"));
          if(r.realPaperCertified!==false||r.liveTradingAllowed!==false||r.ordersGenerated!==0||
             typeof r.haltNewVirtualEntries!=="boolean"||r.ledgerHeadHash!==f.ledgerHeadHash||
             JSON.stringify(f.riskState.policy)!==JSON.stringify(r.policy)||
             f.riskState.riskState!==r.riskState||
             f.riskState.maxRealizedDrawdownPct!==r.maxRealizedDrawdownPct||
             f.riskState.haltNewVirtualEntries!==r.haltNewVirtualEntries)process.exit(1);
          console.log(JSON.stringify({phase6:r.riskState,realizedDrawdownPct:r.maxRealizedDrawdownPct,ordersGenerated:0}));
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const b=JSON.parse(readFileSync("artifacts/phase7/latest-world-brief.json"));
          const f=JSON.parse(readFileSync("artifacts/phase5/latest-forward-research-portfolio.json"));
          const r=JSON.parse(readFileSync("artifacts/phase6/latest-forward-risk-report.json"));
          const h=JSON.parse(readFileSync("artifacts/phase5/latest-historical-portfolio.json"));
          const m=readFileSync("artifacts/phase7/latest-world-brief.md","utf8");
          if(b.mode!=="PHASE7_WORLD_RESEARCH_DAILY_BRIEF"||
             b.ordersGenerated!==0||b.liveTradingAllowed!==false||b.certifiedPaper!==false||
             b.forward.ledgerHeadHash!==f.ledgerHeadHash||b.risk.status!==r.riskState||
             b.historicalSeparate.netPnlEuro!==h.netPnlEuro||
             b.forward.netRealizedEuro!==f.realizedNetPnlEuro||
             b.universe.requested!==8||!m.includes("Risultato storico")||
             !m.includes("Ordini Directa: **0**"))process.exit(1);
          console.log(JSON.stringify({phase7:"VALIDATED_RESEARCH_ONLY",worldSymbols:b.universe.received,shortlist:b.opportunities.length,ordersGenerated:0}));
          NODE
      - name: Publish append-only research evidence to dedicated branch
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/fenice-evidence
          cp artifacts/phase4/persistent/journal.json /tmp/fenice-evidence/journal.json
          cp artifacts/phase4/forward-evaluation.json /tmp/fenice-evidence/latest-evaluation.json
          cp artifacts/phase4/historical-walkforward.json /tmp/fenice-evidence/latest-historical-backtest.json
          cp artifacts/phase5/persistent/ledger.json /tmp/fenice-evidence/phase5-virtual-ledger.json
          cp artifacts/phase5/latest-historical-portfolio.json /tmp/fenice-evidence/latest-phase5-historical-portfolio.json
          cp artifacts/phase5/persistent/forward-ledger.json /tmp/fenice-evidence/phase5-forward-ledger.json
          cp artifacts/phase5/latest-forward-research-portfolio.json /tmp/fenice-evidence/latest-phase5-forward-research-portfolio.json
          cp artifacts/phase6/latest-forward-risk-report.json /tmp/fenice-evidence/latest-phase6-forward-risk-report.json
          cp artifacts/phase7/latest-world-brief.json /tmp/fenice-evidence/latest-phase7-world-brief.json
          cp artifacts/phase7/latest-world-brief.md /tmp/fenice-evidence/phase7-daily-report.md
          if git ls-remote --exit-code --heads origin fenice-phase4-evidence; then
            git fetch origin fenice-phase4-evidence
          fi
          if git show-ref --verify --quiet refs/remotes/origin/fenice-phase4-evidence; then
            git worktree add --detach /tmp/fenice-evidence-work origin/fenice-phase4-evidence
            cd /tmp/fenice-evidence-work
            git switch -C fenice-phase4-evidence
          else
            git worktree add --detach /tmp/fenice-evidence-work HEAD
            cd /tmp/fenice-evidence-work
            git switch --orphan fenice-phase4-evidence
            git rm -rf . >/dev/null || true
          fi
          cp /tmp/fenice-evidence/journal.json journal.json
          cp /tmp/fenice-evidence/latest-evaluation.json latest-evaluation.json
          cp /tmp/fenice-evidence/latest-historical-backtest.json latest-historical-backtest.json
          cp /tmp/fenice-evidence/phase5-virtual-ledger.json phase5-virtual-ledger.json
          cp /tmp/fenice-evidence/latest-phase5-historical-portfolio.json latest-phase5-historical-portfolio.json
          cp /tmp/fenice-evidence/phase5-forward-ledger.json phase5-forward-ledger.json
          cp /tmp/fenice-evidence/latest-phase5-forward-research-portfolio.json latest-phase5-forward-research-portfolio.json
          cp /tmp/fenice-evidence/latest-phase6-forward-risk-report.json latest-phase6-forward-risk-report.json
          cp /tmp/fenice-evidence/latest-phase7-world-brief.json latest-phase7-world-brief.json
          cp /tmp/fenice-evidence/phase7-daily-report.md phase7-daily-report.md
          git config user.name 'fenice-evidence-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal.json latest-evaluation.json latest-historical-backtest.json phase5-virtual-ledger.json latest-phase5-historical-portfolio.json phase5-forward-ledger.json latest-phase5-forward-research-portfolio.json latest-phase6-forward-risk-report.json latest-phase7-world-brief.json phase7-daily-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'FENICE phase4: record immutable public research observations'
            git push origin HEAD:refs/heads/fenice-phase4-evidence
          fi
      - name: Upload phase 7 daily world research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-world-daily-brief-research-only
          path: |
            artifacts/phase7/latest-world-brief.json
            artifacts/phase7/latest-world-brief.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload phase 6 forward virtual risk audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-forward-virtual-risk-not-executable
          path: artifacts/phase6/latest-forward-risk-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload phase 5 research-only forward portfolio and integrity ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-forward-virtual-research-not-executable
          path: |
            artifacts/phase5/latest-forward-research-portfolio.json
            artifacts/phase5/persistent/forward-ledger.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload phase 5 virtual historical portfolio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-historical-portfolio-not-live
          path: artifacts/phase5/latest-historical-portfolio.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload phase 4 historical positive and negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-historical-observed-backtest
          path: artifacts/phase4/historical-walkforward.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload phase 4 forward outcome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-forward-outcomes
          path: artifacts/phase4/forward-evaluation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload phase 4 signal snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-frozen-research-snapshot
          path: artifacts/phase4/signal-snapshot.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload non-certified research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-world-research-unattested
          path: artifacts/phase3/world-research-watchlist.json
          if-no-files-found: error
          retention-days: 14

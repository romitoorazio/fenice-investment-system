name: Fenice FINRA Public Entitlement Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose-finra-public-access.mjs"
      - ".github/workflows/finra-public-access-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  finra-readonly-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test FINRA Public read-only dataset entitlements
        env:
          FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
          FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
        run: node scripts/diagnose-finra-public-access.mjs
      - name: Publish redacted diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: finra-public-readonly-entitlement-diagnostic
          path: finra-public-access-report.json
          retention-days: 7
      - name: Expose support-safe FINRA request id as commit status
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("finra-public-access-report.json", "utf8"));
            const failed = (report.results || []).find(
              (row) => row.httpStatus === 403 && row.finraApiRequestId
            );
            const description = failed
              ? `403 ${failed.id} id=${failed.finraApiRequestId}`
              : `FINRA diagnostic: ${report.state || "NO_RESULT"}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "fenice/finra-diagnostic",
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

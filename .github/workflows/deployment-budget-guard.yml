name: Fenice Deployment Budget Guard
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autonomy.yml"
      - ".github/workflows/paper-validation-early-trigger.yml"
      - ".github/workflows/paper-probe-operator-trigger.yml"
      - "scripts/test-paper-dispatch-fanout-budget.mjs"
      - ".github/workflows/fenice-x.yml"
      - ".github/workflows/market-data-validation-lab.yml"
      - ".github/workflows/engineering-validation-evidence.yml"
      - ".github/workflows/vercel-deploy.yml"
      - ".ops/vercel-deploy-request.json"
      - "lib/ui/engineering-evidence-publish-policy.mjs"
      - "scripts/decide-engineering-evidence-publication.mjs"
      - "scripts/test-deployment-budget-policy.mjs"
      - "scripts/vercel-api-request.mjs"
      - "scripts/test-vercel-api-request.mjs"
      - "scripts/test-foundation-credential-wiring.mjs"
      - "scripts/test-engineering-evidence-publish-policy.mjs"
      - ".github/workflows/deployment-budget-guard.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomy.yml"
      - ".github/workflows/paper-validation-early-trigger.yml"
      - ".github/workflows/paper-probe-operator-trigger.yml"
      - "scripts/test-paper-dispatch-fanout-budget.mjs"
      - ".github/workflows/fenice-x.yml"
      - ".github/workflows/market-data-validation-lab.yml"
      - ".github/workflows/engineering-validation-evidence.yml"
      - ".github/workflows/vercel-deploy.yml"
      - ".ops/vercel-deploy-request.json"
      - "lib/ui/engineering-evidence-publish-policy.mjs"
      - "scripts/decide-engineering-evidence-publication.mjs"
      - "scripts/test-deployment-budget-policy.mjs"
      - "scripts/vercel-api-request.mjs"
      - "scripts/test-vercel-api-request.mjs"
      - "scripts/test-foundation-credential-wiring.mjs"
      - "scripts/test-engineering-evidence-publish-policy.mjs"
      - ".github/workflows/deployment-budget-guard.yml"
permissions:
  contents: read
jobs:
  budget-and-paper-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify schedule and frozen PAPER contracts
        run: node scripts/test-deployment-budget-policy.mjs
      - name: Verify conservative engineering publication policy
        run: node scripts/test-engineering-evidence-publish-policy.mjs
      - name: Verify exact release scope and credential-safe API failures
        run: node scripts/test-vercel-api-request.mjs
      - name: Verify Foundation receives configured FINRA OAuth credentials
        run: node scripts/test-foundation-credential-wiring.mjs
      - name: Verify PAPER recovery subscriptions do not fan out into duplicate jobs
        run: node scripts/test-paper-dispatch-fanout-budget.mjs

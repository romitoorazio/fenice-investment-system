name: Fenice ONE GLOBAL — Unified PAPER Evidence

# Single read-only daily scoreboard. It cannot dispatch archived campaigns,
# place broker orders or write to PAPER ledgers.
on:
  workflow_dispatch:
  schedule:
    - cron: "25 22 * * *"
    - cron: "10 8 * * 1-5" # morning review, research only; no provider or broker calls
  push:
    branches: [main]
    paths:
      - "scripts/fenice-unica-paper-cycle.mjs"
      - "scripts/test-fenice-unica-paper-cycle.mjs"
      - "scripts/run-one-global-strategy-paper.mjs"
      - "data/one-global-strategy-paper-ledger.json"
      - "lib/trading/one-global-strategy-ledger-audit.mjs"
      - "scripts/test-one-global-strategy-ledger-audit.mjs"
      - "scripts/diagnose-one-global-venues.mjs"
      - "scripts/test-one-global-venue-readiness.mjs"
      - "scripts/test-one-global-venue-ui.mjs"
      - "lib/intelligence/one-global-committee-world-coverage.mjs"
      - "scripts/audit-one-global-committee-coverage.mjs"
      - "scripts/test-one-global-committee-coverage.mjs"
      - "app/opportunita-mondo/page.tsx"
      - "lib/ui/one-global-world-radar.mjs"
      - "lib/ui/one-global-world-radar.d.mts"
      - "scripts/test-one-global-world-radar-ui.mjs"
      - "app/paper-mondo/page.tsx"
      - "scripts/test-one-global-strategy-paper.mjs"
      - "scripts/test-one-global-private-intake.mjs"
      - "lib/intelligence/one-global-tactical-watchlist.mjs"
      - "scripts/report-one-global-tactical-watchlist.mjs"
      - "scripts/test-one-global-tactical-watchlist.mjs"
      - "lib/trading/one-global-forward-research.mjs"
      - "scripts/run-one-global-forward-research.mjs"
      - "scripts/test-one-global-forward-research.mjs"
      - "lib/intelligence/one-global-esef-discovery.mjs"
      - "scripts/discover-one-global-esef-filings.mjs"
      - "scripts/test-one-global-esef-discovery.mjs"
      - "lib/intelligence/one-global-esef-ifrs-audit.mjs"
      - "scripts/audit-one-global-esef-ifrs.mjs"
      - "scripts/test-one-global-esef-ifrs-audit.mjs"
      - "scripts/audit-one-global-enel-2025-esef.py"
      - "scripts/test-one-global-enel-2025-esef.py"
      - "lib/intelligence/one-global-fy2025-release-audit.mjs"
      - "scripts/test-one-global-fy2025-release-audit.mjs"
      - "scripts/report-one-global-fy2025-releases.mjs"
      - "data/one-global-fy2025-official-issuer-releases.json"
      - "lib/intelligence/one-global-2026-interim-research.mjs"
      - "scripts/test-one-global-2026-interim-research.mjs"
      - "scripts/report-one-global-2026-interim-research.mjs"
      - "data/one-global-2026-interim-primary-releases.json"
      - "scripts/report-one-global-forward-research.mjs"
      - ".github/workflows/fenice-unica-paper-cycle.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/fenice-unica-paper-cycle.mjs"
      - "scripts/test-one-global-private-intake.mjs"
      - "scripts/run-one-global-strategy-paper.mjs"
      - "scripts/test-fenice-unica-paper-cycle.mjs"
      - "lib/intelligence/one-global-committee-world-coverage.mjs"
      - "scripts/audit-one-global-committee-coverage.mjs"
      - "scripts/test-one-global-committee-coverage.mjs"
      - "lib/intelligence/one-global-tactical-watchlist.mjs"
      - "scripts/report-one-global-tactical-watchlist.mjs"
      - "scripts/test-one-global-tactical-watchlist.mjs"
      - "lib/ui/one-global-world-radar.mjs"
      - "lib/ui/one-global-world-radar.d.mts"
      - "scripts/test-one-global-world-radar-ui.mjs"
      - "lib/intelligence/one-global-fy2025-release-audit.mjs"
      - "scripts/test-one-global-fy2025-release-audit.mjs"
      - "scripts/report-one-global-fy2025-releases.mjs"
      - "data/one-global-fy2025-official-issuer-releases.json"
      - "lib/intelligence/one-global-2026-interim-research.mjs"
      - "scripts/test-one-global-2026-interim-research.mjs"
      - "scripts/report-one-global-2026-interim-research.mjs"
      - "data/one-global-2026-interim-primary-releases.json"
      - "lib/intelligence/one-global-esef-ifrs-audit.mjs"
      - "lib/intelligence/one-global-esef-discovery.mjs"
      - "scripts/audit-one-global-esef-ifrs.mjs"
      - "scripts/test-one-global-esef-ifrs-audit.mjs"
      - "scripts/audit-one-global-enel-2025-esef.py"
      - "scripts/test-one-global-enel-2025-esef.py"
      - ".github/workflows/fenice-unica-paper-cycle.yml"

permissions:
  contents: read

concurrency:
  group: fenice-one-global-readonly-scoreboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout latest evidence on main or inspected PR revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Fail-closed replay and test of one global scorecard
        run: |
          node scripts/test-fenice-unica-paper-cycle.mjs
          node scripts/test-one-global-strategy-paper.mjs
          node scripts/test-one-global-private-intake.mjs
          node scripts/test-one-global-strategy-ledger-audit.mjs
          node scripts/test-one-global-venue-readiness.mjs
          node scripts/test-one-global-venue-ui.mjs
          node scripts/test-one-global-committee-coverage.mjs
          node scripts/test-one-global-tactical-watchlist.mjs
          node scripts/test-one-global-world-radar-ui.mjs
          node scripts/test-one-global-forward-research.mjs
          node scripts/test-one-global-esef-discovery.mjs
          node scripts/test-one-global-esef-ifrs-audit.mjs
          python3 scripts/test-one-global-enel-2025-esef.py
          node scripts/test-one-global-fy2025-release-audit.mjs
          node scripts/test-one-global-2026-interim-research.mjs
      - name: Produce V8/B2/world audited scoreboard, no provider calls
        run: node scripts/fenice-unica-paper-cycle.mjs > fenice-one-global-paper.json
      - name: Evaluate committee-to-world-PAPER forward intent blockers
        run: node scripts/run-one-global-strategy-paper.mjs --output=fenice-one-global-strategy-readiness.json
      - name: Diagnose all eight worldwide venues with independent source-age and rights checks
        run: node scripts/diagnose-one-global-venues.mjs --output=fenice-one-global-venue-readiness.json
      - name: Audit actual committee coverage of world-listed equities
        run: node scripts/audit-one-global-committee-coverage.mjs --output=fenice-one-global-committee-coverage.json
      - name: Rank worldwide short-horizon technical research watchlist, never BUYs
        run: node scripts/report-one-global-tactical-watchlist.mjs --output=fenice-world-tactical-watchlist.json
      - name: Report accumulated REAL later-bar outcomes as research only
        run: node scripts/report-one-global-forward-research.mjs --output=fenice-one-global-forward-research-results.json
      - name: Discover free regulatory filing sources for three European issuers by exact LEI
        run: node scripts/discover-one-global-esef-filings.mjs --output=fenice-one-global-esef-filing-sources.json
      - name: Audit actual EU issuer xBRL-JSON monetary fact periods, entity and EUR reconciliation
        run: node scripts/audit-one-global-esef-ifrs.mjs --output=fenice-one-global-ifrs-fact-audit.json
      - name: Audit official ENEL 2025 ESEF ZIP and annual IFRS monetary facts (read-only, bounded)
        run: python3 scripts/audit-one-global-enel-2025-esef.py --fetch-official --output=fenice-enel-2025-issuer-ixbrl.json
      - name: Publish three FY2025 source-backed issuer releases, never strategy BUYs
        run: node scripts/report-one-global-fy2025-releases.mjs --output=fenice-one-global-fy2025-primary-release-facts.json
      - name: Audit actual official 2026 issuer interim sources with noncomparable period safeguards
        run: node scripts/report-one-global-2026-interim-research.mjs --output=fenice-one-global-2026-current-interim-facts.json
      - name: Publish per-day evidence as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenice-one-global-paper
          path: |
            fenice-one-global-paper.json
            fenice-one-global-strategy-readiness.json
            fenice-one-global-venue-readiness.json
            fenice-one-global-committee-coverage.json
            fenice-world-tactical-watchlist.json
            fenice-one-global-forward-research-results.json
            fenice-one-global-esef-filing-sources.json
            fenice-one-global-ifrs-fact-audit.json
            fenice-enel-2025-issuer-ixbrl.json
            fenice-one-global-fy2025-primary-release-facts.json
            fenice-one-global-2026-current-interim-facts.json
          retention-days: 35
          if-no-files-found: error
      - name: Confirm no historical ledgers or source files modified
        run: |
          # Generated untracked scoreboard is an artifact, not a repository edit.
          git diff --exit-code
          git diff --cached --exit-code
          echo "ONE GLOBAL tracked sources and ledgers remained unchanged."

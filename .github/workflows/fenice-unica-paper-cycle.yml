name: Fenice Unica PAPER Cycle — Read Only
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/fenice-unica-paper-cycle.mjs
      - scripts/test-fenice-unica-paper-cycle.mjs
      - .github/workflows/fenice-unica-paper-cycle.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node scripts/test-fenice-unica-paper-cycle.mjs
      - run: node scripts/fenice-unica-paper-cycle.mjs > fenice-unica-paper-cycle.json
      - uses: actions/upload-artifact@v4
        with:
          name: fenice-unica-paper-cycle
          path: fenice-unica-paper-cycle.json
          retention-days: 14

name: Fenice Global Opportunity Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/ui/global-opportunity-audit.ts"
      - "lib/ui/one-global-world-radar*"
      - "lib/ui/world-market-data-health.mjs"
      - "components/WorldEquityRadar.tsx"
      - "components/MissionControl.tsx"
      - "app/page.tsx"
      - "app/radar/page.tsx"
      - "app/api/research/world-radar/**"
      - "app/api/sources/global/**"
      - "scripts/test-world-market-data-health.mjs"
      - "scripts/test-one-global-world-radar-ui.mjs"
      - "lib/ui/international-research-queue.ts"
      - "scripts/test-international-research-queue.mjs"
      - "app/opportunita-mondo/**"
      - "app/api/research/global-opportunities/**"
      - "app/global/page.tsx"
      - "scripts/test-global-opportunity-audit.mjs"
      - ".github/workflows/global-opportunity-evidence.yml"
  push:
    branches: [main]
    paths:
      - "lib/ui/global-opportunity-audit.ts"
      - "lib/ui/one-global-world-radar*"
      - "lib/ui/world-market-data-health.mjs"
      - "components/WorldEquityRadar.tsx"
      - "components/MissionControl.tsx"
      - "app/page.tsx"
      - "app/radar/page.tsx"
      - "app/api/research/world-radar/**"
      - "app/api/sources/global/**"
      - "scripts/test-world-market-data-health.mjs"
      - "scripts/test-one-global-world-radar-ui.mjs"
      - "lib/ui/international-research-queue.ts"
      - "scripts/test-international-research-queue.mjs"
      - "app/opportunita-mondo/**"
      - "app/api/research/global-opportunities/**"
      - "app/global/page.tsx"
      - "scripts/test-global-opportunity-audit.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/test-global-opportunity-audit.mjs
      - run: node --experimental-strip-types scripts/test-international-research-queue.mjs
      - name: World equity radar and separate source-health dimensions
        run: |
          node scripts/test-one-global-world-radar-ui.mjs
          node scripts/test-world-market-data-health.mjs
      - run: node scripts/scan-repository-secrets.mjs

name: Fenice PAPER Recovery Regression

on:
  pull_request:
    paths:
      - ".github/workflows/paper-probe-operator-trigger.yml"
      - ".github/workflows/paper-recovery-regression.yml"
      - "scripts/test-paper-operator-recovery-config.mjs"
      - "scripts/paper-probe-recovery-trigger.mjs"
      - "scripts/test-paper-probe-recovery-trigger.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-probe-operator-trigger.yml"
      - ".github/workflows/paper-recovery-regression.yml"
      - "scripts/test-paper-operator-recovery-config.mjs"
      - "scripts/paper-probe-recovery-trigger.mjs"
      - "scripts/test-paper-probe-recovery-trigger.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-recovery-regression-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify recovery timing and upstream provenance
        run: node scripts/test-paper-probe-recovery-trigger.mjs
      - name: Verify event-driven recovery remains fail-closed
        run: node scripts/test-paper-operator-recovery-config.mjs

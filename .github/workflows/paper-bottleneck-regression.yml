name: PAPER bottleneck regression
on:
  push:
    paths:
      - "scripts/diagnose-paper-bottlenecks.mjs"
      - "scripts/test-paper-bottleneck-causes.mjs"
      - "package.json"
      - "lib/trading/paper-quote-probe-priority.mjs"
      - "scripts/refresh-twelve-data-batch-evidence.mjs"
      - "scripts/test-paper-quote-probe-priority.mjs"
      - "lib/trading/paper-fx-timestamp.mjs"
      - "scripts/test-paper-fx-timestamp.mjs"
      - ".github/workflows/paper-bottleneck-regression.yml"
  pull_request:
    paths:
      - "scripts/diagnose-paper-bottlenecks.mjs"
      - "scripts/test-paper-bottleneck-causes.mjs"
      - "package.json"
      - "lib/trading/paper-quote-probe-priority.mjs"
      - "scripts/refresh-twelve-data-batch-evidence.mjs"
      - "scripts/test-paper-quote-probe-priority.mjs"
      - "lib/trading/paper-fx-timestamp.mjs"
      - "scripts/test-paper-fx-timestamp.mjs"
      - ".github/workflows/paper-bottleneck-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check script syntax
        run: node --check scripts/diagnose-paper-bottlenecks.mjs && node --check scripts/test-paper-bottleneck-causes.mjs && node --check scripts/refresh-twelve-data-batch-evidence.mjs && node --check lib/trading/paper-quote-probe-priority.mjs && node --check scripts/test-paper-quote-probe-priority.mjs
      - name: Run isolated read-only regression
        run: npm run paper:bottlenecks:test
      - name: Run quote probe prioritization regression
        run: node scripts/test-paper-quote-probe-priority.mjs
      - name: Run FX timestamp safety regression
        run: node scripts/test-paper-fx-timestamp.mjs

name: Fenice V7 Live Review Context

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/ui/paper-review-live-context.ts"
      - "scripts/test-paper-review-live-context.mjs"
      - ".github/workflows/v7-live-review-context.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test read-only provider context with deterministic fixtures
        run: node --experimental-strip-types scripts/test-paper-review-live-context.mjs

      - name: Assert provider context contains no write or broker endpoints
        shell: bash
        run: |
          set -euo pipefail
          if grep -E -n '(/v2/orders|submitOrder|broker.*submit|liveTradingAllowed:[[:space:]]*true|writesAllowed:[[:space:]]*true)'             lib/ui/paper-review-live-context.ts; then
            echo "Unsafe write-capable pattern found in read-only review context"
            exit 1
          fi
          echo "Fresh review context remains read-only and fail-closed."

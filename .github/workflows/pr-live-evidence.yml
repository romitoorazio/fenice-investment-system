name: Fenice PR Live Evidence Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/professional-core-consolidation
    paths:
      - ".github/workflows/pr-live-evidence.yml"
      - "lib/intelligence/quality-engine.mjs"
      - "scripts/run-intelligence.mjs"
      - "scripts/run-execution-market-data.mjs"
      - "scripts/check-execution-market-coverage.mjs"
      - "scripts/check-global-sources.mjs"
      - "scripts/check-paper-baseline-eligibility.mjs"
      - "data/global-source-registry.json"
      - "lib/trading/execution-market-data.ts"
      - "lib/trading/market-data-quorum.ts"
      - "lib/trading/paper-baseline.mjs"
      - "lib/trading/validation-fingerprint.mjs"

permissions:
  contents: read

concurrency:
  group: fenice-pr-live-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FENICE_JOB: intraday
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Refresh critical source health in ephemeral workspace
        run: npm run sources:check

      - name: Build current intelligence quality in ephemeral workspace
        run: node scripts/run-intelligence.mjs

      - name: Build execution market evidence in ephemeral workspace
        run: npm run marketdata:execution

      - name: Measure per-symbol PAPER execution quorum coverage
        run: node --experimental-strip-types scripts/check-execution-market-coverage.mjs

      - name: Assess live evidence without publishing
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('data/intelligence-quality.json', 'utf8'));
          const s = JSON.parse(fs.readFileSync('data/global-source-health.json', 'utf8'));
          const e = JSON.parse(fs.readFileSync('data/execution-market-evidence.json', 'utf8'));
          const c = JSON.parse(fs.readFileSync('data/execution-market-coverage.json', 'utf8'));
          const now = Date.now();
          const ageHours = (value) => {
            const t = Date.parse(value || '');
            return Number.isFinite(t) ? Math.max(0, (now - t) / 3600000) : null;
          };
          const metrics = {
            generatedAt: new Date().toISOString(),
            auditedCommit: process.env.GITHUB_SHA,
            intelligenceConfidence: Number(q.intelligenceConfidence || 0),
            sourceConcentrationPercent: Number(q.coverage?.sourceConcentrationPercent || 100),
            marketSources: Number(q.coverage?.marketSources || 0),
            assetClasses: Array.isArray(q.coverage?.assetClasses) ? q.coverage.assetClasses.length : 0,
            crossChecks: Number(q.crossSourceValidation?.checked || 0),
            divergent: Number(q.crossSourceValidation?.divergent || 0),
            freshEvidenceObservations: Number(q.crossSourceValidation?.evidenceObservations || 0),
            excludedValidationEvidence: Number(q.crossSourceValidation?.staleEvidenceExcluded || 0),
            criticalGate: s.critical?.gate || 'UNKNOWN',
            criticalReady: Number(s.critical?.ready || 0),
            criticalTotal: Number(s.critical?.total || 0),
            sourceReportAgeHours: ageHours(s.generatedAt),
            intelligenceReportAgeHours: ageHours(q.generatedAt),
            executionEvidenceAgeHours: ageHours(e.generatedAt),
            executionObservations: Array.isArray(e.observations) ? e.observations.length : 0,
            executionProviders: [...new Set((e.observations || []).map((row) => row.sourceFamily || row.source).filter(Boolean))].sort(),
            executionErrors: Array.isArray(e.errors) ? e.errors.length : 0,
            paperRequestedSymbols: Number(c.requestedSymbols || 0),
            paperEligibleSymbols: Number(c.paperEligibleSymbols || 0),
            paperEligiblePercent: Number(c.paperEligiblePercent || 0),
            paperGreenSymbols: Array.isArray(c.greenSymbols) ? c.greenSymbols : [],
            paperCautionSymbols: Array.isArray(c.cautionSymbols) ? c.cautionSymbols : [],
            paperBlockedSymbols: Array.isArray(c.blockedSymbols) ? c.blockedSymbols : [],
            liveTradingAllowed: e.policy?.liveTradingAllowed === true,
          };
          const gates = {
            criticalSources: metrics.criticalGate === 'GREEN' && metrics.criticalTotal > 0 && metrics.criticalReady === metrics.criticalTotal,
            confidence90: metrics.intelligenceConfidence >= 90,
            concentration50: metrics.sourceConcentrationPercent <= 50,
            marketSources3: metrics.marketSources >= 3,
            assetClasses3: metrics.assetClasses >= 3,
            crossChecks10: metrics.crossChecks >= 10,
            zeroDivergence: metrics.divergent === 0,
            executionEvidencePresent: metrics.executionObservations > 0,
            paperExecutionCoverage: metrics.paperEligibleSymbols >= 3 && metrics.paperEligiblePercent >= 25,
            liveTradingLocked: metrics.liveTradingAllowed === false,
          };
          const dataQualityGateNames = ['criticalSources', 'confidence90', 'concentration50', 'marketSources3', 'assetClasses3', 'crossChecks10', 'zeroDivergence'];
          const report = {
            metrics,
            gates,
            dataQualityReady: dataQualityGateNames.every((key) => gates[key] === true),
            paperExecutionCoverageReady: gates.executionEvidencePresent && gates.paperExecutionCoverage,
          };
          fs.writeFileSync('data/pr-live-evidence-audit.json', JSON.stringify(report, null, 2) + '\n');
          console.log('FENICE_PR_LIVE_EVIDENCE=' + JSON.stringify(report));
          if (!gates.liveTradingLocked) throw new Error('SAFETY_FAILURE: execution evidence claims live trading allowed');
          NODE

      - name: Paper baseline eligibility on fresh ephemeral evidence
        run: npm run paper:baseline:status

      - name: Certification status on fresh ephemeral evidence
        run: npm run certification:status

      - name: Upload ephemeral evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenice-pr-live-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            data/pr-live-evidence-audit.json
            data/intelligence-quality.json
            data/global-source-health.json
            data/execution-market-evidence.json
            data/execution-market-coverage.json

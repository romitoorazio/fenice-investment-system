name: Financial Data Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: read

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: python_financial_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_financial_data/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Fenice snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python fenice_snapshot.py --config fenice_config.example.json --output output/fenice-snapshot.json

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenice-financial-snapshot
          path: python_financial_data/output/fenice-snapshot.json
          if-no-files-found: error
          retention-days: 14

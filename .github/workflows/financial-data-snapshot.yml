name: Financial Data Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: python_financial_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_financial_data/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate snapshot used by Fenice
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python fenice_snapshot.py --config fenice_config.example.json --output ../data/latest-snapshot.json

      - name: Validate generated JSON
        run: python -m json.tool ../data/latest-snapshot.json > /dev/null

      - name: Publish updated snapshot
        working-directory: .
        run: |
          git config user.name "fenice-data-bot"
          git config user.email "actions@users.noreply.github.com"

          generated_file="$(mktemp)"
          cp data/latest-snapshot.json "$generated_file"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_file" data/latest-snapshot.json
            git add data/latest-snapshot.json

            if git diff --cached --quiet; then
              echo "Nessuna variazione da pubblicare."
              exit 0
            fi

            git commit -m "data: refresh global financial snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish financial snapshot after 3 attempts"
          exit 1

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenice-financial-snapshot
          path: data/latest-snapshot.json
          if-no-files-found: error
          retention-days: 14

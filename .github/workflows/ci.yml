name: Fenice Production CI

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/history/**"
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fenice-production-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Repository secret scan
        run: node scripts/scan-repository-secrets.mjs

      - name: Lint
        run: npm run lint

      - name: TypeScript and production build
        run: npm run build

      - name: Broker recognition and compile-time live lock
        run: npm run broker:safety

      - name: Institutional paper OMS safety
        run: npm run trading:ops

      - name: Position sizing and drawdown risk invariants
        run: npm run risk:advanced:test

      - name: Risk-of-ruin firewall invariants
        run: npm run risk:ruin:test

      - name: Portfolio concentration and correlation invariants
        run: npm run risk:portfolio:test

      - name: Portfolio factor stress invariants
        run: npm run risk:stress:test

      - name: Multi-factor exposure regression invariants
        run: npm run risk:factor:test

      - name: Market-data quorum fail-closed invariants
        run: npm run marketdata:quorum:test

      - name: Execution market-data routing invariants
        run: npm run marketdata:execution:test

      - name: Combined operational gates fail-closed invariants
        run: npm run operational:gates:test

      - name: Conditional STOP trailing OCO and bracket semantics
        run: npm run orders:conditional:test

      - name: Persistent paper conditional book invariants
        run: npm run orders:conditional-book:test

      - name: Event-risk gate invariants
        run: npm run events:risk:test

      - name: Directa read-only protocol firewall
        run: npm run directa:readonly:test

      - name: Directa read-only market-data protocol
        run: npm run directa:datafeed:test

      - name: Directa diagnostic redaction safety
        run: npm run directa:diagnostic-safety:test

      - name: Directa entitlement fallback safety
        run: npm run directa:entitlement:test

      - name: Intelligence quality engine invariants
        run: npm run intelligence:quality:test

      - name: Forecast calibration invariants
        run: npm run calibration:test

      - name: Build current calibration analysis
        run: npm run calibration:analyze

      - name: 30-day paper campaign invariants
        run: npm run paper:validation:test

      - name: Institutional risk reconciliation shadow and recovery controls
        run: npm run institutional:test

      - name: Atomic state persistence and corruption handling
        run: npm run state:test

      - name: Adverse-condition chaos resilience
        run: npm run chaos:test

      - name: Paper conditional OMS smoke test
        run: npm run paper:conditional

      - name: Paper OMS runner smoke test
        run: npm run paper:run

      - name: Source checker security invariants
        run: node scripts/test-source-health-security.mjs

      - name: Validate published datasets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'data/latest-snapshot.json',
            'data/fundamental-research.json',
            'data/terminal-intelligence.json',
            'data/terminal-alerts.json',
            'data/terminal-state.json',
            'data/dcf-analysis.json',
            'data/strategy-lab.json',
            'data/paper-oms-state.json',
            'data/paper-order-queue.json',
            'data/paper-conditional-state.json',
            'data/paper-conditional-queue.json',
            'data/execution-market-evidence.json',
            'data/market-risk-events.json',
            'data/calibration-analysis.json',
            'data/paper-validation-campaign.json',
          ];
          for (const file of files) {
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!parsed || typeof parsed !== 'object') throw new Error(`Invalid dataset: ${file}`);
            console.log('Validated', file);
          }
          NODE

      - name: Validate critical structures
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const terminal = JSON.parse(fs.readFileSync('data/terminal-intelligence.json', 'utf8'));
          if (!Array.isArray(terminal.assets) || terminal.assets.length < 10) throw new Error('Terminal asset coverage insufficient');
          for (const asset of terminal.assets) {
            if (!asset.symbol || !asset.technical || !Number.isFinite(asset.unifiedScore) || !Number.isFinite(asset.riskScore)) {
              throw new Error(`Invalid terminal asset: ${asset.symbol || 'unknown'}`);
            }
          }
          const research = JSON.parse(fs.readFileSync('data/fundamental-research.json', 'utf8'));
          if (!Array.isArray(research.companies) || research.companies.length < 8) throw new Error('Research coverage insufficient');
          const evidence = JSON.parse(fs.readFileSync('data/execution-market-evidence.json', 'utf8'));
          if (!Array.isArray(evidence.observations)) throw new Error('Execution market evidence structure invalid');
          const eventRisk = JSON.parse(fs.readFileSync('data/market-risk-events.json', 'utf8'));
          if (!Array.isArray(eventRisk.events)) throw new Error('Market risk events structure invalid');
          const conditional = JSON.parse(fs.readFileSync('data/paper-conditional-state.json', 'utf8'));
          if (!conditional.book || !Array.isArray(conditional.book.singles) || !Array.isArray(conditional.book.ocoGroups)) {
            throw new Error('Paper conditional state structure invalid');
          }
          const calibration = JSON.parse(fs.readFileSync('data/calibration-analysis.json', 'utf8'));
          if (!calibration.horizons || !calibration.horizons['7d'] || !calibration.horizons['30d']) {
            throw new Error('Calibration analysis structure invalid');
          }
          if (calibration.policy?.confidenceCanOnlyBeReducedByCalibration !== true || calibration.policy?.liveTradingAllowed !== false) {
            throw new Error('Calibration policy invariant violated');
          }
          const campaign = JSON.parse(fs.readFileSync('data/paper-validation-campaign.json', 'utf8'));
          if (campaign.liveTradingAllowed !== false || Number(campaign.requiredDays) < 30) {
            throw new Error('Paper validation campaign policy invariant violated');
          }
          console.log('Critical datasets are structurally valid');
          NODE

      - name: Certification readiness and live-lock invariants
        run: node scripts/check-certification-readiness.mjs

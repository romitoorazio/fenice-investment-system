name: Fenice Production CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/history/**"
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fenice-production-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Lint
        run: npm run lint

      - name: TypeScript and production build
        run: npm run build

      - name: Validate published datasets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'data/latest-snapshot.json',
            'data/fundamental-research.json',
            'data/terminal-intelligence.json',
            'data/terminal-alerts.json',
            'data/terminal-state.json',
            'data/dcf-analysis.json',
            'data/strategy-lab.json',
            'data/decision-governance.json',
            'data/decision-ledger.json',
            'data/global-source-health.json',
          ];
          for (const file of files) {
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!parsed || typeof parsed !== 'object') throw new Error(`Invalid dataset: ${file}`);
            console.log('Validated', file);
          }
          NODE

      - name: Validate critical structures
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const terminal = JSON.parse(fs.readFileSync('data/terminal-intelligence.json', 'utf8'));
          if (!Array.isArray(terminal.assets) || terminal.assets.length < 10) throw new Error('Terminal asset coverage insufficient');
          for (const asset of terminal.assets) {
            if (!asset.symbol || !asset.technical || !Number.isFinite(asset.unifiedScore) || !Number.isFinite(asset.riskScore)) {
              throw new Error(`Invalid terminal asset: ${asset.symbol || 'unknown'}`);
            }
          }
          const research = JSON.parse(fs.readFileSync('data/fundamental-research.json', 'utf8'));
          if (!Array.isArray(research.companies) || research.companies.length < 8) throw new Error('Research coverage insufficient');
          console.log('Critical datasets are structurally valid');
          NODE

      - name: Enforce paper-only trading guardrails
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const governance = JSON.parse(fs.readFileSync('data/decision-governance.json', 'utf8'));
          const guardrails = governance.guardrails || {};
          if (guardrails.blockAutonomousTrading !== true) throw new Error('Autonomous trading must remain blocked');
          if (guardrails.requireHumanConfirmation !== true) throw new Error('Human confirmation must remain mandatory');
          const prohibited = Array.isArray(governance.prohibitedActions) ? governance.prohibitedActions.join(' ').toLowerCase() : '';
          if (!prohibited.includes('ordini') || !prohibited.includes('broker')) {
            throw new Error('Governance must explicitly prohibit order transmission and broker connection');
          }
          console.log('Paper-only trading guardrails enforced');
          NODE

      - name: Prevent secrets in published source health
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const health = fs.readFileSync('data/global-source-health.json', 'utf8');
          const parsed = JSON.parse(health);
          for (const source of parsed.sources || []) {
            const endpoint = String(source.endpointUsed || '');
            const matches = [...endpoint.matchAll(/[?&](api[_-]?key|apikey|token|access[_-]?token|key)=([^&#]+)/gi)];
            for (const match of matches) {
              if (match[2] !== '[REDACTED]') throw new Error(`Possible secret persisted for source ${source.id}`);
            }
          }
          console.log('No API credentials persisted in source-health endpoints');
          NODE

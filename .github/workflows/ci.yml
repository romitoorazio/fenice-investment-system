name: Fenice Production CI

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/history/**"
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fenice-production-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Repository secret scan
        run: node scripts/scan-repository-secrets.mjs

      - name: Lint
        run: npm run lint

      - name: TypeScript and production build
        run: npm run build

      - name: Institutional source hardening syntax and registry
        run: |
          node --check scripts/collect-institutional-signals.mjs
          node --check scripts/collect-exchange-market-validation.mjs
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('data/global-source-registry.json', 'utf8'));
          const ids = registry.sources.map(source => source.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate source IDs in registry');
          for (const required of ['bls', 'us-treasury-fiscal', 'cftc-cot', 'finra-trace']) {
            if (!ids.includes(required)) throw new Error(`Missing institutional source: ${required}`);
          }
          console.log('Institutional source registry valid:', ids.length, 'sources');
          NODE

      - name: Source checker security invariants
        run: node scripts/test-source-health-security.mjs

      - name: Source-status reconciliation invariants
        run: node --experimental-strip-types scripts/test-source-health-overlay.mjs

      - name: Validate published datasets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'data/latest-snapshot.json',
            'data/fundamental-research.json',
            'data/terminal-intelligence.json',
            'data/terminal-alerts.json',
            'data/terminal-state.json',
            'data/dcf-analysis.json',
            'data/strategy-lab.json',
          ];
          for (const file of files) {
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!parsed || typeof parsed !== 'object') throw new Error(`Invalid dataset: ${file}`);
            console.log('Validated', file);
          }
          NODE

      - name: Validate critical structures
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const terminal = JSON.parse(fs.readFileSync('data/terminal-intelligence.json', 'utf8'));
          if (!Array.isArray(terminal.assets) || terminal.assets.length < 10) throw new Error('Terminal asset coverage insufficient');
          for (const asset of terminal.assets) {
            if (!asset.symbol || !asset.technical || !Number.isFinite(asset.unifiedScore) || !Number.isFinite(asset.riskScore)) {
              throw new Error(`Invalid terminal asset: ${asset.symbol || 'unknown'}`);
            }
          }
          const research = JSON.parse(fs.readFileSync('data/fundamental-research.json', 'utf8'));
          if (!Array.isArray(research.companies) || research.companies.length < 8) throw new Error('Research coverage insufficient');
          console.log('Critical datasets are structurally valid');
          NODE

      - name: Certification readiness and live-lock invariants
        run: node scripts/check-certification-readiness.mjs

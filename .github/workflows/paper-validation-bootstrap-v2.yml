name: Fenice PAPER Validation Bootstrap V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-validation-bootstrap-v2.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: fenice-paper-validation-bootstrap-v2
  cancel-in-progress: false

jobs:
  dispatch-canonical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical PAPER validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run paper-validation.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Canonical Fenice Paper Validation dispatched from immutable v2 bootstrap trigger."

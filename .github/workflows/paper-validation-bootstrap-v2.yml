name: Fenice PAPER Validation Bootstrap V2

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: fenice-paper-validation-dispatcher
  cancel-in-progress: false

jobs:
  dispatch-canonical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Dispatch and verify fresh PAPER baseline workflow
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow="paper-validation.yml"
          validation_run=""
          success=false

          for dispatch_attempt in 1 2 3; do
            dispatch_token="baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${dispatch_attempt}"
            expected_title="Fenice Paper Validation [$dispatch_token]"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main -f dispatch_token="$dispatch_token"

            validation_run=""
            for discovery_attempt in $(seq 1 60); do
              runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 100 --json databaseId,displayTitle,createdAt)"
              candidates="$(jq -c --arg expected "$expected_title" '[.[] | select(.displayTitle == $expected)]' <<<"$runs")"
              count="$(jq 'length' <<<"$candidates")"

              if [ "$count" -eq 1 ]; then
                validation_run="$(jq -r '.[0].databaseId' <<<"$candidates")"
                break
              fi

              if [ "$count" -gt 1 ]; then
                echo "Duplicate PAPER validation correlation token detected; refusing to guess."
                jq . <<<"$candidates"
                exit 1
              fi

              sleep 2
            done

            test -n "$validation_run"
            echo "Watching canonical PAPER validation run $validation_run (dispatch attempt $dispatch_attempt/3)"

            if gh run watch "$validation_run" --repo "$GITHUB_REPOSITORY" --exit-status; then
              success=true
              break
            fi

            conclusion="$(gh run view "$validation_run" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "unknown"')"
            echo "Canonical PAPER validation run $validation_run ended with conclusion=$conclusion."

            if [ "$conclusion" != "cancelled" ]; then
              echo "Non-cancellation failure is authoritative; refusing automatic retry."
              exit 1
            fi

            if [ "$dispatch_attempt" -lt 3 ]; then
              echo "Run was cancelled by scheduling/concurrency pressure before useful execution; retrying without weakening any gate."
              sleep 8
            fi
          done

          if [ "$success" != "true" ]; then
            echo "PAPER validation could not obtain an execution slot after 3 cancellation-safe attempts."
            exit 1
          fi

          echo "run_id=$validation_run" >> "$GITHUB_OUTPUT"

      - name: Verify fresh immutable PAPER baseline exists on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          campaign="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-validation-campaign.json?ref=main")"
          jq -e '
            .startedAt != null and
            .baselineCommit != null and
            .baselineFingerprint != null and
            .baselineFingerprint.complete == true and
            .baselineFingerprint.algorithm == "sha256" and
            .liveTradingAllowed == false
          ' <<<"$campaign" >/dev/null

          echo "Fresh PAPER baseline confirmed on main; LIVE remains locked."

      - name: Dispatch and verify corrected PAPER probe cycle
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow="paper-probe-staging.yml"
          dispatch_token="probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_title="Fenice PAPER Validation Probe Cycle [$dispatch_token]"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main -f dispatch_token="$dispatch_token"

          probe_run=""
          for attempt in $(seq 1 60); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 100 --json databaseId,displayTitle,createdAt)"
            candidates="$(jq -c --arg expected "$expected_title" '[.[] | select(.displayTitle == $expected)]' <<<"$runs")"
            count="$(jq 'length' <<<"$candidates")"

            if [ "$count" -eq 1 ]; then
              probe_run="$(jq -r '.[0].databaseId' <<<"$candidates")"
              break
            fi

            if [ "$count" -gt 1 ]; then
              echo "Duplicate PAPER probe correlation token detected; refusing to guess."
              jq . <<<"$candidates"
              exit 1
            fi

            sleep 2
          done

          test -n "$probe_run"
          echo "Watching canonical PAPER probe run $probe_run"
          gh run watch "$probe_run" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "run_id=$probe_run" >> "$GITHUB_OUTPUT"

      - name: Confirm bootstrap completed without LIVE permissions
        run: |
          echo "Fenice PAPER v6 baseline run ${{ steps.baseline.outputs.run_id }} and probe run ${{ steps.probe.outputs.run_id }} completed."
          echo "The v6 bootstrap requires the unified fresh decision-data gate plus fresh market USD/EUR conversion evidence; LIVE and broker connectivity remain governed by the canonical fail-closed workflows."

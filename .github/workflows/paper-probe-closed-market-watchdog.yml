name: Fenice PAPER Closed-Market Probe Watchdog

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/paper-probe-closed-market-watchdog.yml"
      - "scripts/paper-probe-request-window.mjs"
      - "scripts/test-paper-probe-request-window.mjs"
  workflow_run:
    workflows:
      - Fenice PAPER Validation Probe Cycle
    types:
      - requested

permissions:
  actions: write
  contents: read

concurrency:
  group: fenice-paper-closed-market-watchdog-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cancel first: a delayed schedule must not reach provider refresh while the
      # versioned policy checkout and regression test are still starting.
      - name: Classify scheduled probe request immediately
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule'
        id: fast_request_window
        env:
          REQUESTED_AT: ${{ github.event.workflow_run.created_at }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const instant = new Date(process.env.REQUESTED_AT || '');
          let weekday = null;
          let minutes = null;
          let allowed = false;
          let reason = 'invalid-request-time';
          if (Number.isFinite(instant.getTime())) {
            const parts = Object.fromEntries(
              new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                weekday: 'short',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23',
              }).formatToParts(instant).map(({ type, value }) => [type, value]),
            );
            weekday = parts.weekday;
            minutes = Number(parts.hour) * 60 + Number(parts.minute);
            allowed = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(weekday)
              && minutes >= 9 * 60 + 30
              && minutes < 16 * 60;
            reason = allowed ? 'inside-regular-new-york-session' : 'outside-regular-new-york-session';
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\nreason=${reason}\n`);
          console.log(`Fast PAPER probe request window: allowed=${allowed}; reason=${reason}; newYorkWeekday=${weekday}; newYorkMinutes=${minutes}.`);
          NODE

      - name: Cancel delayed closed-market scheduled probe
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && steps.fast_request_window.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID" --jq '.status')"
          case "$status" in
            queued|in_progress|waiting|pending|requested)
              if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/cancel"; then
                echo "Cancelled delayed scheduled PAPER probe outside regular New York hours."
              else
                final_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID" --jq '.status')"
                if [ "$final_status" != "completed" ]; then
                  echo "Unable to cancel active delayed PAPER probe; status=$final_status." >&2
                  exit 1
                fi
                echo "Scheduled PAPER probe completed before cancellation could be applied."
              fi
              ;;
            *)
              echo "No cancellation needed; upstream status=$status."
              ;;
          esac

      - name: Checkout watchdog policy
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}

      - name: Regression-test New York request window
        run: node scripts/test-paper-probe-request-window.mjs

      - name: Verify fast classification with versioned policy
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule'
        id: verified_request_window
        env:
          REQUESTED_AT: ${{ github.event.workflow_run.created_at }}
        run: node scripts/paper-probe-request-window.mjs --requested-at "$REQUESTED_AT" --github-output "$GITHUB_OUTPUT"

      - name: Assert fast and versioned classifications agree
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule'
        env:
          FAST_ALLOWED: ${{ steps.fast_request_window.outputs.allowed }}
          VERIFIED_ALLOWED: ${{ steps.verified_request_window.outputs.allowed }}
          FAST_REASON: ${{ steps.fast_request_window.outputs.reason }}
          VERIFIED_REASON: ${{ steps.verified_request_window.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FAST_ALLOWED" = "$VERIFIED_ALLOWED"
          test "$FAST_REASON" = "$VERIFIED_REASON"
          echo "Fast cancellation classification matches the versioned, regression-tested policy."

      - name: Confirm allowed or non-scheduled request
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'schedule' || steps.fast_request_window.outputs.allowed == 'true'
        run: echo "No scheduled PAPER probe cancellation required."

name: Fenice PAPER Market-Open Readiness

on:
  workflow_dispatch:
  # Independent from GitHub cron delivery: Foundation already produces
  # validated research. Recovery is strictly diagnostic and time-limited.
  workflow_run:
    workflows: ["Fenice Foundation"]
    types: [completed]
    branches: [main]
  schedule:
    # Opening checks 15 minutes after the US regular session begins.
    # US DST: 13:30 UTC open; standard time: 14:30 UTC open.
    # Alpaca's authoritative clock skips closed/holiday sessions without
    # refreshing paid or free quote providers. Duplicate OPEN windows stay
    # diagnostic-only and obey the existing provider budget.
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
    # Independent mid-session recovery if GitHub defers its opening jobs.
    - cron: "15 16 * * 1-5"
  push:
    branches:
      - feature/professional-core-consolidation
    paths:
      - ".github/workflows/paper-open-readiness.yml"
      - "package.json"
      - "scripts/check-paper-market-session.mjs"
      - "scripts/check-paper-open-readiness.mjs"
      - "scripts/verify-market-open-schedule.mjs"
      - "scripts/test-market-open-schedule.mjs"
      - "scripts/test-runtime-paper-quote-gate.mjs"
      - "lib/trading/runtime-paper-quote-gate.ts"
      - "app/api/trading/readiness/route.ts"
      - "scripts/test-paper-open-readiness-orchestration.mjs"
      - "scripts/run-execution-market-data.mjs"
      - "scripts/refresh-twelve-data-batch-evidence.mjs"
      - "scripts/test-twelve-data-batch.mjs"
      - "scripts/check-execution-market-coverage.mjs"
      - "scripts/check-global-sources.mjs"
      - "scripts/reconcile-global-source-health.mjs"
      - "scripts/run-intelligence.mjs"
      - "scripts/run-foundation-plus.mjs"
      - "scripts/test-global-source-health-reconcile.mjs"
      - "scripts/test-source-health-security.mjs"
      - "lib/trading/market-session.ts"
      - "lib/trading/paper-baseline.mjs"
      - "lib/trading/execution-market-data.ts"
      - "lib/trading/twelve-data-batch.mjs"
      - "lib/trading/execution-coverage.ts"
      - "lib/intelligence/quality-engine.mjs"
      - "lib/intelligence/optional-source-recovery.mjs"
      - "lib/intelligence/global-source-health-reconcile.mjs"
      - "data/global-source-registry.json"
      - "data/instrument-master.json"

permissions:
  contents: read

concurrency:
  group: fenice-paper-open-readiness-${{ github.ref }}
  # Do not cancel a genuine timely scheduled opening audit because a
  # Foundation completion happens while it is sampling.
  cancel-in-progress: false

jobs:
  readiness:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.name == 'Fenice Foundation')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FENICE_JOB: intraday
      # Basic has 8 API credits/minute. Four symbols leave the independent PR
      # audit another four credits while preserving the >=3-symbol PAPER gate.
      FENICE_TWELVE_DATA_EXECUTION_PROBES: "-1"
      FENICE_TWELVE_DATA_BATCH_PROBES: "4"
      FENICE_ALPHA_VANTAGE_EXECUTION_PROBES: "-1"
      FENICE_ALPACA_EXECUTION_PROBES: "6"
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
      FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}

    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit scheduled market-open sampling delay
        id: schedule_guard
        continue-on-error: true
        env:
          FENICE_SCHEDULE_CRON: ${{ github.event.schedule }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node scripts/verify-market-open-schedule.mjs

      - name: Regression-test scheduler delay detection
        run: node scripts/test-market-open-schedule.mjs

      - name: Regression-test execution quote freshness
        run: node --experimental-strip-types scripts/test-runtime-paper-quote-gate.mjs

      # An hours-late GitHub schedule is not a fresh opening-session audit.
      # Preserve the failed scheduler report, but do not spend any provider
      # credits or install dependencies for a run already known to be invalid.
      - name: Install dependencies
        if: steps.schedule_guard.outcome == 'success'
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate instrument identities and venues
        if: steps.schedule_guard.outcome == 'success'
        run: npm run instruments:validate

      - name: Read authoritative PAPER market session
        if: steps.schedule_guard.outcome == 'success'
        run: node --experimental-strip-types scripts/check-paper-market-session.mjs

      - name: Gate provider refresh to authoritative open session
        if: steps.schedule_guard.outcome == 'success'
        id: session_gate
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { assessPersistedPaperSession } from './lib/intelligence/persisted-paper-session-gate.mjs';
          const session = JSON.parse(fs.readFileSync('data/paper-market-session.json', 'utf8'));
          const open = assessPersistedPaperSession(session).marketOpen;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `market_open=${open}\n`);
          console.log(`PAPER readiness provider refresh: market_open=${open}.`);
          NODE

      - name: Regression-test readiness orchestration
        run: node scripts/test-paper-open-readiness-orchestration.mjs

      - name: Refresh critical source health
        if: steps.session_gate.outputs.market_open == 'true'
        run: npm run sources:check

      - name: Build fresh intelligence quality
        if: steps.session_gate.outputs.market_open == 'true'
        run: node scripts/run-intelligence.mjs

      - name: Build fresh base execution evidence
        if: steps.session_gate.outputs.market_open == 'true'
        run: npm run marketdata:execution

      - name: Refresh coherent Twelve Data batch evidence
        if: steps.session_gate.outputs.market_open == 'true'
        run: node --experimental-strip-types scripts/refresh-twelve-data-batch-evidence.mjs

      - name: Measure per-symbol PAPER coverage
        if: steps.session_gate.outputs.market_open == 'true'
        run: node --experimental-strip-types scripts/check-execution-market-coverage.mjs

      # Intelligence and market-data collection can legitimately take several
      # minutes, longer than the 120-second authority of the opening clock.
      # Re-observe the exchange through the same authenticated PAPER-only
      # clock. Do not extend timestamps or reuse a stale OPEN observation.
      - name: Recheck authoritative PAPER market session after provider collection
        if: steps.session_gate.outputs.market_open == 'true'
        run: node --experimental-strip-types scripts/check-paper-market-session.mjs

      - name: Classify market-open PAPER readiness
        if: steps.schedule_guard.outcome == 'success'
        run: node --experimental-strip-types scripts/check-paper-open-readiness.mjs --require-session --require-ready-if-open

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenice-paper-open-readiness
          if-no-files-found: error
          retention-days: 7
          path: |
            data/paper-market-session.json
            data/paper-open-schedule-audit.json
            data/paper-fx-evidence.json
            data/paper-open-readiness.json
            data/global-source-health.json
            data/intelligence-quality.json
            data/execution-market-evidence.json
            data/execution-market-coverage.json

      - name: Confirm refused recovery without provider refresh or opening proof
        if: always() && github.event_name == 'workflow_run' && steps.schedule_guard.outcome == 'failure'
        run: echo "::notice::Foundation recovery not in approved New York early-session window or missing trusted provenance; no market-data calls or opening proof."

      - name: Reject missed scheduled market-open window
        if: always() && github.event_name == 'schedule' && steps.schedule_guard.outcome == 'failure'
        run: |
          echo "::error::Market-open readiness schedule missed its sampling window. A closed-market success cannot replace an opening-session audit."
          exit 1

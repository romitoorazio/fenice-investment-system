name: Fenice PAPER Candidate Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/diagnose-paper-v7-runway.mjs"
      - "scripts/test-paper-v7-runway.mjs"
      - ".github/workflows/paper-candidate-diagnostics.yml"
  workflow_run:
    workflows:
      - Fenice PAPER Validation Probe Cycle
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-paper-candidates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic code and evidence snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Explain PAPER candidate eligibility
        run: node scripts/explain-paper-validation-candidates.mjs

      - name: Regression-test PAPER opportunity ranking
        run: node scripts/test-paper-validation-opportunity-ranking.mjs

      - name: Regression-test active V6 committee sensitivity
        run: node scripts/test-paper-v6-committee-sensitivity.mjs

      - name: Build PAPER opportunity map
        env:
          FENICE_PAPER_OPPORTUNITY_REPORT: paper-candidate-opportunities.json
        run: node scripts/rank-paper-validation-opportunities.mjs

      - name: Explain active V6 committee threshold distance
        env:
          FENICE_PAPER_OPPORTUNITY_REPORT: paper-candidate-opportunities.json
          FENICE_PAPER_V6_COMMITTEE_SENSITIVITY: paper-v6-committee-sensitivity.json
        run: node scripts/analyze-paper-v6-committee-sensitivity.mjs

      - name: Diagnose PAPER V7 runway without modifying V6
        env:
          FENICE_V7_RUNWAY_REPORT: paper-v7-runway.json
        run: node scripts/diagnose-paper-v7-runway.mjs

      - name: Regression-test PAPER V7 runway diagnostic
        run: node scripts/test-paper-v7-runway.mjs

      - name: Upload PAPER diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: paper-candidate-opportunities-${{ github.run_id }}
          path: |
            paper-candidate-opportunities.json
            paper-v6-committee-sensitivity.json
            paper-v7-runway.json
          if-no-files-found: error
          retention-days: 14

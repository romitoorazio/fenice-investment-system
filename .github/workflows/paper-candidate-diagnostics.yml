name: Fenice PAPER Candidate Diagnostics

on:
  workflow_run:
    workflows:
      - Fenice PAPER Probe
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain-paper-candidates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main evidence snapshot
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Explain PAPER candidate eligibility
        run: node scripts/explain-paper-validation-candidates.mjs

      - name: Regression-test PAPER opportunity ranking
        run: node scripts/test-paper-validation-opportunity-ranking.mjs

      - name: Build PAPER opportunity map
        env:
          FENICE_PAPER_OPPORTUNITY_REPORT: paper-candidate-opportunities.json
        run: node scripts/rank-paper-validation-opportunities.mjs

      - name: Upload PAPER opportunity map
        uses: actions/upload-artifact@v4
        with:
          name: paper-candidate-opportunities-${{ github.run_id }}
          path: paper-candidate-opportunities.json
          if-no-files-found: error
          retention-days: 14

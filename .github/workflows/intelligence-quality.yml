name: Fenice Intelligence Quality

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5,11,17,23 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/run-intelligence.mjs"
      - "scripts/run-execution-market-data.mjs"
      - "scripts/check-execution-market-coverage.mjs"
      - "scripts/check-global-sources.mjs"
      - "data/global-source-registry.json"
      - "lib/trading/execution-market-data.ts"
      - "lib/trading/market-data-quorum.ts"
      - "scripts/run-foundation-plus.mjs"
      - "scripts/run-foundation.mjs"
      - ".github/workflows/intelligence-quality.yml"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FENICE_JOB: intraday
      FENICE_TWELVE_DATA_EXECUTION_PROBES: "3"
      FENICE_ALPHA_VANTAGE_EXECUTION_PROBES: "3"
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Refresh critical source health
        run: npm run sources:check

      - name: Build current intelligence quality report
        run: node scripts/run-intelligence.mjs

      - name: Build independent execution market evidence
        run: npm run marketdata:execution

      - name: Measure per-symbol PAPER execution quorum coverage
        run: node --experimental-strip-types scripts/check-execution-market-coverage.mjs

      - name: Validate quality report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const q = JSON.parse(fs.readFileSync('data/intelligence-quality.json', 'utf8'));
          const age = Date.now() - Date.parse(q.generatedAt || '');
          if (!Number.isFinite(age) || age < 0 || age > 60 * 60 * 1000) throw new Error('Intelligence quality report is not fresh');
          if (!Number.isFinite(q.intelligenceConfidence)) throw new Error('Missing intelligence confidence');
          if (!Number.isFinite(q.coverage?.sourceConcentrationPercent)) throw new Error('Missing source concentration');
          if (!Array.isArray(q.crossSourceValidation?.checks)) throw new Error('Missing cross-source validation checks');
          if (q.policy?.unknownTimestampEvidenceExcluded !== true) throw new Error('Unknown timestamp evidence must be excluded');

          const sourceHealth = JSON.parse(fs.readFileSync('data/global-source-health.json', 'utf8'));
          const sourceAge = Date.now() - Date.parse(sourceHealth.generatedAt || '');
          if (!Number.isFinite(sourceAge) || sourceAge < 0 || sourceAge > 60 * 60 * 1000) throw new Error('Global source health is not fresh');
          if (!sourceHealth.critical || !Number.isFinite(Number(sourceHealth.critical.total))) throw new Error('Critical source health missing');

          const execution = JSON.parse(fs.readFileSync('data/execution-market-evidence.json', 'utf8'));
          const executionAge = Date.now() - Date.parse(execution.generatedAt || '');
          if (!Number.isFinite(executionAge) || executionAge < 0 || executionAge > 60 * 60 * 1000) throw new Error('Execution market evidence is not fresh');
          if (Number(execution.version || 0) < 2) throw new Error('Execution market evidence schema is obsolete');
          if (!Array.isArray(execution.observations)) throw new Error('Execution market observations missing');
          if (execution.policy?.validationOnlySourcesNeverSatisfyPaperQuorum !== true) throw new Error('Validation-only execution data policy missing');
          if (execution.policy?.untaggedLegacyEvidenceDefaultsToValidationOnly !== true) throw new Error('Legacy execution evidence must fail closed');
          if (execution.policy?.liveEligibilityMustBeExplicit !== true) throw new Error('Live eligibility must be explicit');
          if (execution.policy?.liveTradingAllowed !== false) throw new Error('Live trading must remain blocked');
          const eligibility = new Set(['VALIDATION_ONLY', 'PAPER', 'LIVE']);
          for (const observation of execution.observations) {
            if (!observation?.source || !observation?.sourceFamily) throw new Error('Execution observation missing source provenance');
            if (!eligibility.has(observation?.eligibility)) throw new Error('Execution observation has invalid eligibility');
            if (!Number.isFinite(Number(observation?.price)) || Number(observation.price) <= 0) throw new Error('Execution observation has invalid price');
            if (!Number.isFinite(Date.parse(String(observation?.observedAt || '')))) throw new Error('Execution observation has invalid timestamp');
          }

          const executionCoverage = JSON.parse(fs.readFileSync('data/execution-market-coverage.json', 'utf8'));
          const coverageAge = Date.now() - Date.parse(executionCoverage.generatedAt || '');
          if (!Number.isFinite(coverageAge) || coverageAge < 0 || coverageAge > 60 * 60 * 1000) throw new Error('Execution market coverage is not fresh');
          if (executionCoverage.evidenceGeneratedAt !== execution.generatedAt) throw new Error('Execution coverage does not match the audited execution evidence snapshot');
          if (!Array.isArray(executionCoverage.rows)) throw new Error('Execution market coverage rows missing');
          if (executionCoverage.policy?.requiredEligibility !== 'PAPER' || Number(executionCoverage.policy?.minIndependentSourceFamilies || 0) < 2) {
            throw new Error('Execution market coverage policy is unsafe');
          }
          if (executionCoverage.policy?.liveTradingAllowed !== false) throw new Error('Execution market coverage must preserve live lock');

          console.log('Quality report valid:', q.intelligenceConfidence, q.coverage.sourceConcentrationPercent, 'source gate:', sourceHealth.gate, 'execution observations:', execution.observations.length, 'paper eligible symbols:', executionCoverage.paperEligibleSymbols, '/', executionCoverage.requestedSymbols, 'Twelve Data:', execution.capabilities?.twelveDataConfigured === true ? 'configured' : 'optional-unconfigured');
          NODE

      - name: Publish refreshed quality evidence
        run: |
          git config user.name "fenice-quality-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          cp data/latest-snapshot.json "$generated_dir/latest-snapshot.json"
          cp data/intelligence-quality.json "$generated_dir/intelligence-quality.json"
          cp data/source-health.json "$generated_dir/source-health.json"
          cp data/global-source-health.json "$generated_dir/global-source-health.json"
          cp data/execution-market-evidence.json "$generated_dir/execution-market-evidence.json"
          cp data/execution-market-coverage.json "$generated_dir/execution-market-coverage.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/latest-snapshot.json" data/latest-snapshot.json
            cp "$generated_dir/intelligence-quality.json" data/intelligence-quality.json
            cp "$generated_dir/source-health.json" data/source-health.json
            cp "$generated_dir/global-source-health.json" data/global-source-health.json
            cp "$generated_dir/execution-market-evidence.json" data/execution-market-evidence.json
            cp "$generated_dir/execution-market-coverage.json" data/execution-market-coverage.json
            git add data/latest-snapshot.json data/intelligence-quality.json data/source-health.json data/global-source-health.json data/execution-market-evidence.json data/execution-market-coverage.json

            if git diff --cached --quiet; then
              echo "No quality evidence changes to commit"
              exit 0
            fi

            git commit -m "data: refresh intelligence quality evidence"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish intelligence quality evidence after 3 attempts"
          exit 1

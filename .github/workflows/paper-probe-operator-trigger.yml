name: Fenice PAPER Probe Operator Trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-probe-operator-trigger.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: fenice-paper-probe-operator-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify active fail-closed campaign, cooldown and intelligence quality
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          campaign="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-validation-campaign.json?ref=main")"
          approval="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-validation-approval.json?ref=main")"
          oms="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-oms-state.json?ref=main")"
          intelligence="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/intelligence-quality.json?ref=main")"

          active="$(jq -r '(.startedAt != null) and (.baselineCommit != null) and (.baselineFingerprint.complete == true) and (.baselineFingerprint.algorithm == "sha256") and (.liveTradingAllowed == false)' <<<"$campaign")"
          prefix="$(jq -r '.idPrefix // "fenice-paper-validation-"' <<<"$approval")"
          today="$(date -u +%F)"
          attempted_today="$(jq -r --arg prefix "$prefix" --arg today "$today" 'any(.executions[]?; (((.clientOrderId // "") | startswith($prefix)) or (.validationProbe == true)) and (((.createdAt // .filledAt // "") | tostring) | startswith($today)))' <<<"$oms")"

          cooldown_ready="$(node -e '
            const q = JSON.parse(process.argv[1]);
            const t = Date.parse(String(q.generatedAt || ""));
            const age = Number.isFinite(t) ? (Date.now() - t) / 60000 : -1;
            process.stdout.write(String(Number.isFinite(age) && age >= 15));
          ' "$intelligence")"

          quality_ready="$(node -e '
            const q = JSON.parse(process.argv[1]);
            const c = JSON.parse(process.argv[2]);
            const p = c?.evidencePolicy || {};
            const confidence = Number(q?.intelligenceConfidence ?? -1);
            const checks = Number(q?.crossSourceValidation?.checked ?? -1);
            const divergent = Number(q?.crossSourceValidation?.divergent ?? -1);
            const concentration = Number(q?.coverage?.sourceConcentrationPercent ?? 101);
            const marketSources = Number(q?.coverage?.marketSources ?? 0);
            const assetClasses = Array.isArray(q?.coverage?.assetClasses) ? q.coverage.assetClasses.length : 0;
            const minConfidence = Number(p.minimumIntelligenceConfidence ?? 90);
            const minChecks = Number(p.minimumCrossSourceChecks ?? 10);
            const maxConcentration = Number(p.maximumSourceConcentrationPercent ?? 50);
            const ready = Number.isFinite(confidence)
              && Number.isFinite(checks)
              && Number.isFinite(divergent)
              && Number.isFinite(concentration)
              && confidence >= minConfidence
              && checks >= minChecks
              && divergent === 0
              && concentration <= maxConcentration
              && marketSources >= 2
              && assetClasses >= 2;
            process.stdout.write(String(ready));
          ' "$intelligence" "$campaign")"

          run_probe=false
          if [ "$active" = "true" ] && [ "$attempted_today" != "true" ] && [ "$cooldown_ready" = "true" ] && [ "$quality_ready" = "true" ]; then
            run_probe=true
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "attempted_today=$attempted_today" >> "$GITHUB_OUTPUT"
          echo "cooldown_ready=$cooldown_ready" >> "$GITHUB_OUTPUT"
          echo "quality_ready=$quality_ready" >> "$GITHUB_OUTPUT"
          echo "run_probe=$run_probe" >> "$GITHUB_OUTPUT"
          echo "PAPER operator preflight: active=$active; attempted_today=$attempted_today; intelligence_cooldown_ready=$cooldown_ready; intelligence_quality_ready=$quality_ready; dispatch=$run_probe."

      - name: Dispatch canonical PAPER probe cycle
        if: steps.preflight.outputs.run_probe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run paper-probe-staging.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Canonical PAPER probe cycle dispatched. All sizing, daily caps, data quorum, risk, audit, reconciliation, LIVE and broker-connectivity gates remain authoritative inside the canonical workflow."

      - name: Confirm fail-closed skip
        if: steps.preflight.outputs.run_probe != 'true'
        run: |
          echo "No PAPER probe dispatched."
          echo "Reasons are intentionally fail-closed: inactive campaign, a probe already attempted today, less than 15 minutes since the latest persisted intelligence refresh, or persisted intelligence quality below the campaign policy thresholds."

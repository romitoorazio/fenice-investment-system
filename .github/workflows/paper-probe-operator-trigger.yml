name: Fenice PAPER Probe Operator Trigger

on:
  workflow_dispatch:
  schedule:
    # Spread recovery checkpoints across the session: nearby cron events have
    # repeatedly arrived together after the US close. These checks do not
    # execute PAPER logic itself: it can only dispatch the fingerprinted
    # canonical probe after duplicate/quality/cooldown/active-run suppression.
    - cron: "55 14 * * 1-5"
    - cron: "5 16 * * 1-5"
    - cron: "15 17 * * 1-5"
    - cron: "25 18 * * 1-5"
    # Final late-session quality-recovery checkpoint. The runtime gate below
    # still refuses dispatch after 19:30 UTC, so delayed GitHub cron delivery
    # cannot turn this into a near-close or after-hours PAPER probe.
    - cron: "25 19 * * 1-5"
  workflow_run:
    workflows:
      # Successful scheduled main runs provide recovery opportunities even if
      # GitHub omits dedicated PAPER cron events. All still pass the same
      # market-window, freshness, quality, cooldown and duplicate gates below.
      - Fenice Global Sources
      - Fenice Foundation
      - Fenice World Terminal
      - Fenice Autonomous Analysis
      - Fenice Production CI
    types:
      - completed
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-probe-operator-trigger.yml"
      - "scripts/paper-probe-recovery-trigger.mjs"
      - "scripts/paper-probe-cooldown.mjs"
      - "scripts/paper-probe-deferred-recheck.mjs"
      - "scripts/test-paper-probe-deferred-recheck.mjs"

permissions:
  actions: write
  contents: read

concurrency:
  group: fenice-paper-probe-operator-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENT_NAME: ${{ github.event_name }}
      UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
      UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
    steps:
      - name: Checkout trusted main recovery policy
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Gate recovery trigger before repository API reads
        id: trigger_gate
        run: node scripts/paper-probe-recovery-trigger.mjs --github-output "$GITHUB_OUTPUT"

      - name: Regression-test bounded deferred cooldown recheck
        run: node scripts/test-paper-probe-deferred-recheck.mjs

      - name: Verify active fail-closed campaign, evidence age and intelligence quality
        if: steps.trigger_gate.outputs.allowed == 'true'
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          campaign="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-validation-campaign.json?ref=main")"
          approval="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-validation-approval.json?ref=main")"
          oms="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-oms-state.json?ref=main")"
          intelligence="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/intelligence-quality.json?ref=main")"
          source_health="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/global-source-health.json?ref=main")"
          execution="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/execution-market-evidence.json?ref=main")"
          probe_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow paper-probe-staging.yml --branch main --limit 30 --json databaseId,status,conclusion,createdAt,updatedAt,event,headBranch)"
          validation_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow paper-validation.yml --branch main --limit 30 --json databaseId,status,conclusion,createdAt,updatedAt,event,headBranch)"

          # Preserve the 15-minute provider cooldown without penalizing a fresh
          # research-quality report. Also suppress overlapping canonical PAPER
          # validation cycles, which can spend the same provider credits.
          probe_file="$RUNNER_TEMP/paper-cooldown-probe-runs.json"
          validation_file="$RUNNER_TEMP/paper-cooldown-validation-runs.json"
          execution_file="$RUNNER_TEMP/paper-cooldown-execution-evidence.json"
          printf '%s\n' "$probe_runs" > "$probe_file"
          printf '%s\n' "$validation_runs" > "$validation_file"
          printf '%s\n' "$execution" > "$execution_file"
          cooldown_metrics="$(node scripts/paper-probe-cooldown.mjs --probe-runs "$probe_file" --validation-runs "$validation_file" --execution-evidence "$execution_file")"

          active="$(jq -r '(.startedAt != null) and (.baselineCommit != null) and (.baselineFingerprint.complete == true) and (.baselineFingerprint.algorithm == "sha256") and (.liveTradingAllowed == false)' <<<"$campaign")"
          prefix="$(jq -r '.idPrefix // "fenice-paper-validation-"' <<<"$approval")"
          today="$(date -u +%F)"
          attempted_today="$(jq -r --arg prefix "$prefix" --arg today "$today" 'any(.executions[]?; (((.clientOrderId // "") | startswith($prefix)) or (.validationProbe == true)) and (((.createdAt // .filledAt // "") | tostring) | startswith($today)))' <<<"$oms")"
          active_probe_run="$(jq -r 'any(.[]?; (.status == "queued") or (.status == "in_progress") or (.status == "waiting") or (.status == "pending") or (.status == "requested"))' <<<"$probe_runs")"
          probe_cycles_today="$(jq -r --arg today "$today" '[.[]? | select((((.createdAt // "") | tostring) | startswith($today)))] | length' <<<"$probe_runs")"
          probe_cycle_budget_ready=false
          if [ "$probe_cycles_today" -lt 2 ]; then
            probe_cycle_budget_ready=true
          fi

          # Apply the conservative recovery window to every trigger type. GitHub
          # may deliver cron events hours late, so a schedule event is not proof
          # that the market is still open. This gate prevents dispatching the
          # canonical provider-refresh cycle outside the safe US session window.
          utc_weekday="$(date -u +%u)"
          utc_hour="$(date -u +%H)"
          utc_minute="$(date -u +%M)"
          utc_minutes=$((10#$utc_hour * 60 + 10#$utc_minute))
          request_window_ready=false
          # 14:35-19:30 UTC is safely inside regular US equity hours in both
          # daylight and standard time. Holidays/early closes still fail closed
          # inside the canonical authoritative Alpaca market-clock gate.
          if [ "$utc_weekday" -le 5 ] \
            && [ "$utc_minutes" -ge 875 ] \
            && [ "$utc_minutes" -le 1170 ]; then
            request_window_ready=true
          fi

          recovery_event_ready=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            recovery_event_ready=false
            if [ "$UPSTREAM_CONCLUSION" = "success" ] \
              && [ "$UPSTREAM_EVENT" = "schedule" ] \
              && [ "$UPSTREAM_HEAD_BRANCH" = "main" ]; then
              recovery_event_ready=true
            fi
          fi

          intelligence_metrics="$(node -e '
            const q = JSON.parse(process.argv[1]);
            const t = Date.parse(String(q.generatedAt || ""));
            const ageMinutes = Number.isFinite(t) ? (Date.now() - t) / 60000 : Number.POSITIVE_INFINITY;
            const confidence = Number(q?.intelligenceConfidence ?? -1);
            const checks = Number(q?.crossSourceValidation?.checked ?? -1);
            const divergent = Number(q?.crossSourceValidation?.divergent ?? -1);
            const concentration = Number(q?.coverage?.sourceConcentrationPercent ?? 101);
            const marketSources = Number(q?.coverage?.marketSources ?? 0);
            const assetClasses = Array.isArray(q?.coverage?.assetClasses) ? q.coverage.assetClasses.length : 0;
            const timestampPolicy = q?.policy?.unknownTimestampEvidenceExcluded === true;
            const ageValid = Number.isFinite(ageMinutes) && ageMinutes >= 0 && ageMinutes <= 24 * 60;
            const qualityReady = ageValid
              && Number.isFinite(confidence)
              && Number.isFinite(checks)
              && Number.isFinite(divergent)
              && Number.isFinite(concentration)
              && confidence >= 90
              && checks >= 10
              && divergent === 0
              && concentration <= 50
              && marketSources >= 3
              && assetClasses >= 3
              && timestampPolicy;
            process.stdout.write(JSON.stringify({
              ageMinutes: Number.isFinite(ageMinutes) ? Number(ageMinutes.toFixed(1)) : null,
              ageValid,
              qualityReady,
              confidence,
              checks,
              divergent,
              concentration,
              marketSources,
              assetClasses,
              timestampPolicy,
            }));
          ' "$intelligence")"

          source_metrics="$(node -e '
            const s = JSON.parse(process.argv[1]);
            const t = Date.parse(String(s.generatedAt || ""));
            const ageMinutes = Number.isFinite(t) ? (Date.now() - t) / 60000 : Number.POSITIVE_INFINITY;
            const total = Number(s?.critical?.total ?? 0);
            const ready = Number(s?.critical?.ready ?? -1);
            const ageValid = Number.isFinite(ageMinutes) && ageMinutes >= 0 && ageMinutes <= 24 * 60;
            const sourcesReady = ageValid && s?.critical?.gate === "GREEN" && total > 0 && ready === total;
            process.stdout.write(JSON.stringify({
              ageMinutes: Number.isFinite(ageMinutes) ? Number(ageMinutes.toFixed(1)) : null,
              ageValid,
              sourcesReady,
              gate: String(s?.critical?.gate || "UNKNOWN"),
              ready,
              total,
            }));
          ' "$source_health")"

          intelligence_age_valid="$(jq -r '.ageValid' <<<"$intelligence_metrics")"
          intelligence_age_minutes="$(jq -r '.ageMinutes // "unknown"' <<<"$intelligence_metrics")"
          cooldown_ready="$(jq -r '.ready' <<<"$cooldown_metrics")"
          defer_metrics="$(EVENT_NAME="$EVENT_NAME" COOLDOWN_JSON="$cooldown_metrics" node scripts/paper-probe-deferred-recheck.mjs)"
          defer_ready="$(jq -r '.defer' <<<"$defer_metrics")"
          defer_wait_seconds="$(jq -r '.waitSeconds // 0' <<<"$defer_metrics")"
          quality_ready="$(jq -r '.qualityReady' <<<"$intelligence_metrics")"
          source_age_valid="$(jq -r '.ageValid' <<<"$source_metrics")"
          source_age_minutes="$(jq -r '.ageMinutes // "unknown"' <<<"$source_metrics")"
          sources_ready="$(jq -r '.sourcesReady' <<<"$source_metrics")"

          run_probe=false
          defer_probe=false
          if [ "$active" = "true" ] \
            && [ "$attempted_today" != "true" ] \
            && [ "$active_probe_run" != "true" ] \
            && [ "$probe_cycle_budget_ready" = "true" ] \
            && [ "$request_window_ready" = "true" ] \
            && [ "$recovery_event_ready" = "true" ] \
            && [ "$intelligence_age_valid" = "true" ] \
            && [ "$source_age_valid" = "true" ] \
            && [ "$cooldown_ready" = "true" ] \
            && [ "$quality_ready" = "true" ] \
            && [ "$sources_ready" = "true" ]; then
            run_probe=true
          fi

          if [ "$run_probe" != "true" ] \
            && [ "$active" = "true" ] \
            && [ "$attempted_today" != "true" ] \
            && [ "$active_probe_run" != "true" ] \
            && [ "$probe_cycle_budget_ready" = "true" ] \
            && [ "$request_window_ready" = "true" ] \
            && [ "$recovery_event_ready" = "true" ] \
            && [ "$intelligence_age_valid" = "true" ] \
            && [ "$source_age_valid" = "true" ] \
            && [ "$quality_ready" = "true" ] \
            && [ "$sources_ready" = "true" ] \
            && [ "$defer_ready" = "true" ]; then
            defer_probe=true
          fi

          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "attempted_today=$attempted_today" >> "$GITHUB_OUTPUT"
          echo "active_probe_run=$active_probe_run" >> "$GITHUB_OUTPUT"
          echo "probe_cycles_today=$probe_cycles_today" >> "$GITHUB_OUTPUT"
          echo "probe_cycle_budget_ready=$probe_cycle_budget_ready" >> "$GITHUB_OUTPUT"
          echo "request_window_ready=$request_window_ready" >> "$GITHUB_OUTPUT"
          echo "recovery_event_ready=$recovery_event_ready" >> "$GITHUB_OUTPUT"
          echo "intelligence_age_valid=$intelligence_age_valid" >> "$GITHUB_OUTPUT"
          echo "source_age_valid=$source_age_valid" >> "$GITHUB_OUTPUT"
          echo "cooldown_ready=$cooldown_ready" >> "$GITHUB_OUTPUT"
          echo "quality_ready=$quality_ready" >> "$GITHUB_OUTPUT"
          echo "sources_ready=$sources_ready" >> "$GITHUB_OUTPUT"
          echo "run_probe=$run_probe" >> "$GITHUB_OUTPUT"
          echo "defer_probe=$defer_probe" >> "$GITHUB_OUTPUT"
          echo "defer_wait_seconds=$defer_wait_seconds" >> "$GITHUB_OUTPUT"

          echo "PAPER operator preflight: event=$EVENT_NAME; active=$active; attempted_today=$attempted_today; active_probe_run=$active_probe_run; probe_cycles_today=$probe_cycles_today; cycle_budget_ready=$probe_cycle_budget_ready; request_window_ready=$request_window_ready; recovery_event_ready=$recovery_event_ready; intelligence_age=${intelligence_age_minutes}m; source_health_age=${source_age_minutes}m; cooldown_ready=$cooldown_ready; defer_ready=$defer_ready; defer_probe=$defer_probe; defer_wait=${defer_wait_seconds}s; institutional_quality_ready=$quality_ready; critical_sources_ready=$sources_ready; dispatch=$run_probe."
          echo "Intelligence diagnostics: $(jq -c '.' <<<"$intelligence_metrics")"
          echo "Critical-source diagnostics: $(jq -c '.' <<<"$source_metrics")"
          echo "Provider-cooldown diagnostics: $(jq -c '.' <<<"$cooldown_metrics")"
          echo "Deferred-recheck diagnostics: $(jq -c '.' <<<"$defer_metrics")"

      - name: Dispatch canonical PAPER probe cycle
        if: steps.preflight.outputs.run_probe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/paper-probe-recovery-trigger.mjs --require-allowed
          dispatch_token="operator-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run paper-probe-staging.yml --repo "$GITHUB_REPOSITORY" --ref main -f dispatch_token="$dispatch_token"
          echo "Canonical PAPER probe cycle dispatched. All sizing, daily caps, data quorum, risk, audit, reconciliation, LIVE and broker-connectivity gates remain authoritative inside the canonical workflow."

      - name: Wait only for remaining provider cooldown
        if: steps.preflight.outputs.defer_probe == 'true'
        env:
          WAIT_SECONDS: ${{ steps.preflight.outputs.defer_wait_seconds }}
        run: |
          set -euo pipefail
          case "$WAIT_SECONDS" in
            ''|*[!0-9]*) echo "Invalid deferred wait"; exit 1 ;;
          esac
          if [ "$WAIT_SECONDS" -le 0 ] || [ "$WAIT_SECONDS" -gt 905 ]; then
            echo "Deferred wait outside bounded policy: $WAIT_SECONDS"
            exit 1
          fi
          echo "Waiting ${WAIT_SECONDS}s for provider cooldown before one fresh operator recheck."
          sleep "$WAIT_SECONDS"

      - name: Dispatch one deferred operator recheck
        if: steps.preflight.outputs.defer_probe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run paper-probe-operator-trigger.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Deferred operator recheck dispatched once. The new workflow_dispatch run cannot defer itself again and must re-evaluate all campaign, window, cooldown, quality, duplicate and LIVE/broker locks."

      - name: Confirm fail-closed skip
        if: steps.preflight.outputs.run_probe != 'true' && steps.preflight.outputs.defer_probe != 'true'
        run: |
          echo "No PAPER probe dispatched."
          echo "Reasons are intentionally fail-closed: inactive campaign, a probe already attempted today, an active canonical PAPER probe or validation cycle, two canonical probe cycles already launched today, any trigger delivered outside the conservative US market recovery window, an invalid event-driven recovery, persisted intelligence/source-health evidence older than 24 hours or future-dated, invalid provider/run timestamps or less than 15 minutes since the latest execution-provider evidence or canonical PAPER cycle, institutional intelligence quality below baseline standards, or critical source health not GREEN."

name: Fenice Market-Open Schedule Safety

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/paper-open-readiness.yml"
      - ".github/workflows/paper-open-schedule-safety.yml"
      - "scripts/verify-market-open-schedule.mjs"
      - "scripts/test-market-open-schedule.mjs"
      - "scripts/test-paper-open-readiness-orchestration.mjs"
      - "lib/intelligence/persisted-paper-session-gate.mjs"
      - "lib/trading/runtime-paper-quote-gate.ts"
      - "scripts/test-runtime-paper-quote-gate.mjs"
      - "scripts/check-paper-open-readiness.mjs"
      - "app/api/trading/readiness/route.ts"

permissions:
  contents: read

jobs:
  schedule-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested PR revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test delayed market-open sampling
        run: node scripts/test-market-open-schedule.mjs
      - name: Test readiness orchestration
        run: node scripts/test-paper-open-readiness-orchestration.mjs
      - name: Test 120-second quote freshness and independent PAPER quorum
        run: node --experimental-strip-types scripts/test-runtime-paper-quote-gate.mjs

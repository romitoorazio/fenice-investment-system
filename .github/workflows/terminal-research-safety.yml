name: Fenice Terminal Research Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terminal-research-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify free issuer LEI source discovery cannot fake fundamental ratios
        run: node scripts/test-one-global-esef-discovery.mjs
      - name: Verify IFRS source facts have exact entity, period, currency and context
        run: node scripts/test-one-global-esef-ifrs-audit.mjs
      - name: Verify FY2025 issuer announcements never create non-equivalent ratios or PAPER orders
        run: node scripts/test-one-global-fy2025-release-audit.mjs
      - name: Verify forward worldwide research outcomes and fail-closed hash chain
        run: node scripts/test-one-global-forward-research.mjs
      - name: Verify dedicated Terminal queue and safe concurrent push retry
        run: node scripts/test-terminal-trigger-config.mjs
      - name: Verify daily quotes are research-only and stale signals cannot receive allocations
        run: node --experimental-strip-types scripts/test-terminal-research-freshness.mjs
      - name: Verify eleven non-US exact-venue research seeds, vendor identity and PAPER locks
        run: node scripts/test-world-terminal-universe.mjs
      - name: Verify missing DCF values never become fictitious zero estimates
        run: node scripts/test-committee-valuation-numbers.mjs

name: Fenice Directa Global Entitlement Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/trading/directa-global-entitlement-proof.ts"
      - "scripts/test-directa-global-entitlement-proof.mjs"
      - "data/directa-global-market-entitlements.json"
      - ".github/workflows/directa-global-entitlement-safety.yml"
  push:
    branches:
      - feat/global-market-data-certification
    paths:
      - "lib/trading/directa-global-entitlement-proof.ts"
      - "scripts/test-directa-global-entitlement-proof.mjs"
      - "data/directa-global-market-entitlements.json"
      - ".github/workflows/directa-global-entitlement-safety.yml"

permissions:
  contents: read

jobs:
  validate-directa-global-entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout revision
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test persisted plus runtime Directa entitlement proof
        run: node --experimental-strip-types scripts/test-directa-global-entitlement-proof.mjs

      - name: Assert Directa entitlement registry is empty default-deny
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/directa-global-market-entitlements.json', 'utf8'));
          if (d?.policy !== 'DEFAULT_DENY_DUAL_CONTROL') throw new Error('DIRECTA_GLOBAL_ENTITLEMENT_DEFAULT_DENY_REQUIRED');
          if (!Array.isArray(d?.entitlements)) throw new Error('DIRECTA_GLOBAL_ENTITLEMENT_ARRAY_REQUIRED');
          if (d.entitlements.length !== 0) throw new Error('DIRECTA_GLOBAL_ENTITLEMENT_MUST_REMAIN_EMPTY_UNTIL_REAL_EVIDENCE');
          console.log('Directa global entitlement registry contains no invented entitlement evidence.');
          NODE

      - name: Assert runtime env alone cannot unlock Directa global PAPER
        run: |
          grep -q 'persistedEvidenceFound && runtimeClaimMatched' lib/trading/directa-global-entitlement-proof.ts
          grep -q 'evidenceSha256' lib/trading/directa-global-entitlement-proof.ts
          grep -q 'validUntil' lib/trading/directa-global-entitlement-proof.ts
          echo 'Directa exact-MIC dual-control entitlement invariants present.'

name: Fenice UI Evidence Regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fenice-ui-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paper-evidence-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify fail-closed PAPER evidence UI states
        run: node --experimental-strip-types scripts/test-paper-evidence-state.mjs

      - name: Verify market-open readiness rejects stale stored evidence
        run: node scripts/test-paper-open-readiness-orchestration.mjs

      - name: Verify committee-first Compra/Vendi classification
        run: node --experimental-strip-types scripts/test-committee-decision-display.mjs

      - name: Verify worldwide pilot coverage never grants PAPER or Directa orders
        run: node --experimental-strip-types scripts/test-market-coverage-plan.mjs

      - name: Verify optional research fallback cannot substitute stale prices or bypass provenance
        run: node scripts/test-research-fallback-safety.mjs

      - name: Verify PAPER authorization expiry and minimum campaign duration
        run: node --experimental-strip-types scripts/test-paper-certification-window.mjs

      - name: Verify strict PAPER temporal risk boundary and core diagnostics
        run: node --experimental-strip-types scripts/test-paper-temporal-risk.mjs

      - name: Verify Performance Center evidence never fabricates PnL
        run: node --experimental-strip-types scripts/test-performance-evidence.mjs

      - name: Verify PAPER OMS positions reconcile to historical fill and FX evidence
        run: node --experimental-strip-types scripts/test-paper-position-reconciliation.mjs

      - name: Verify Fenice analyst uses grounded committee decisions
        run: node --experimental-strip-types scripts/test-fenice-grounded-analyst.mjs

      - name: Verify optional generative analyst authorization, budget and no broker access
        run: node --experimental-strip-types scripts/test-fenice-generative-research.mjs

      - name: Verify generative responses cannot invent trades, performance or sources
        run: node --experimental-strip-types scripts/test-fenice-output-verification.mjs

      - name: Verify persistent AI owner login cookie safety and browser renewal
        run: node --experimental-strip-types scripts/test-fenice-owner-session.mjs

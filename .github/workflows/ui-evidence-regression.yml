name: Fenice UI Evidence Regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fenice-ui-evidence-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paper-evidence-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify fail-closed PAPER evidence UI states
        run: node --experimental-strip-types scripts/test-paper-evidence-state.mjs

      - name: Verify market-open readiness rejects stale stored evidence
        run: node scripts/test-paper-open-readiness-orchestration.mjs

      - name: Verify committee-first Compra/Vendi classification
        run: node --experimental-strip-types scripts/test-committee-decision-display.mjs

      - name: Verify PAPER authorization expiry and minimum campaign duration
        run: node --experimental-strip-types scripts/test-paper-certification-window.mjs

      - name: Verify Performance Center evidence never fabricates PnL
        run: node --experimental-strip-types scripts/test-performance-evidence.mjs

      - name: Verify Fenice analyst uses grounded committee decisions
        run: node --experimental-strip-types scripts/test-fenice-grounded-analyst.mjs

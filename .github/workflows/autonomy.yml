name: Fenice Foundation

on:
  workflow_dispatch:
    inputs:
      job:
        description: Data collection mode
        required: false
        default: full
        type: choice
        options: [full, daily, intraday]
  schedule:
    - cron: "17 * * * *"
    - cron: "37 5 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "components/**"
      - "data/global-universe.json"
      - "lib/autonomy.ts"
      - "lib/mission.ts"
      - "lib/research.ts"
      - "lib/terminal.ts"
      - "app/api/sources/**"
      - "app/api/research/**"
      - "app/api/terminal/**"
      - "app/research/**"
      - "app/terminal/**"
      - "package.json"
      - ".github/workflows/autonomy.yml"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Validate global universe
        run: |
          node -e "const fs=require('fs');const u=JSON.parse(fs.readFileSync('data/global-universe.json'));if(!Array.isArray(u.instruments)||u.instruments.length<40)process.exit(1);const s=new Set(u.instruments.map(x=>x.symbol));if(s.size!==u.instruments.length)process.exit(1);console.log('Global universe:',u.instruments.length,'instruments')"

      - name: Collect and validate sources
        env:
          FENICE_JOB: ${{ inputs.job || (github.event.schedule == '37 5 * * *' && 'daily') || 'intraday' }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run foundation

      - name: Validate generated files
        run: |
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('data/latest-snapshot.json'));if(!s.generatedAt||!Array.isArray(s.providers)||!s.foundation||!s.reliability||!s.reliability.marketEnrichmentAt||!s.research)process.exit(1);if(!Number.isFinite(s.dataQuality))process.exit(1);console.log(s.headline,'quality',s.dataQuality,'freshness',s.freshness?.status,'research',s.research.companyCount)"
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('data/source-health.json'));if(!Array.isArray(h.sources))process.exit(1);console.log('Sources checked:',h.sources.length)"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('data/fundamental-research.json'));if(!Array.isArray(r.companies)||!Number.isFinite(r.coveragePercent)||!r.source)process.exit(1);console.log('Fundamental companies:',r.companyCount,'coverage',r.coveragePercent,'average',r.averageScore)"
          node -e "const fs=require('fs');const t=JSON.parse(fs.readFileSync('data/terminal-intelligence.json'));if(!Array.isArray(t.assets)||!Array.isArray(t.portfolio)||!Number.isFinite(t.coveragePercent)||!Number.isFinite(t.dataQuality)||!t.source)process.exit(1);for(const a of t.assets){if(!a.technical||!Number.isFinite(a.unifiedScore)||!Number.isFinite(a.riskScore)||!Array.isArray(a.technical.strategies))process.exit(1)};console.log('Terminal assets:',t.assetCount,'coverage',t.coveragePercent,'quality',t.dataQuality,'score',t.averageUnifiedScore)"

      - name: Commit data history
        run: |
          git config user.name "fenice-foundation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          cp -a data "$generated_dir/data"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data
            cp -a "$generated_dir/data" data
            git add data

            if git diff --cached --quiet; then
              echo "No data changes to commit"
              exit 0
            fi

            git commit -m "Update Fenice Foundation data"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish Foundation data after 3 attempts"
          exit 1

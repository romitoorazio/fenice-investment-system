name: Fenice Archived B2 Evidence Audit — Manual Only

# The redundant B2 recovery dispatcher was retired in favor of ONE GLOBAL V8.
# Preserve the B2 baseline/ledger and leave the original signed core untouched.
# This workflow is MANUAL and READ-ONLY: no dispatches, market API or broker.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-legacy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Historical B2 safety and replay-only regression
        run: node scripts/test-v7-b2-baseline.mjs
      - name: Report B2 frozen fingerprint versus current core without rewriting consent
        run: node scripts/audit-paper-baselines.mjs --output "$RUNNER_TEMP/fenice-archived-b2-baseline.json"
      - name: Publish forensic report
        uses: actions/upload-artifact@v4
        with:
          name: archived-b2-readonly-evidence
          path: ${{ runner.temp }}/fenice-archived-b2-baseline.json
          retention-days: 35
      - name: Ensure no archived campaign mutation
        run: test -z "$(git status --porcelain)"

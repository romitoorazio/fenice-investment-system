name: Fenice ONE GLOBAL Contract Tests
on:
  push:
    branches: [architecture/fenice-one-global-v1, fix/one-global-integration-safety-reconcile-20261107, main]
    paths:
      - "lib/global/**"
      - "scripts/test-fenice-one-global-*.mjs"
      - "scripts/refresh-twelve-data-batch-evidence-enhanced.mjs"
      - "lib/trading/paper-fx-timestamp.mjs"
      - "lib/trading/paper-quote-probe-priority.mjs"
      - ".github/workflows/fenice-one-global-contracts.yml"
  pull_request:
    paths:
      - "lib/global/**"
      - "scripts/test-fenice-one-global-*.mjs"
      - "scripts/refresh-twelve-data-batch-evidence-enhanced.mjs"
      - "lib/trading/paper-fx-timestamp.mjs"
      - "lib/trading/paper-quote-probe-priority.mjs"
      - ".github/workflows/fenice-one-global-contracts.yml"
  workflow_dispatch:
  # GitHub executes scheduled workflows only from the default branch.
  # Once merged, this read-only check will run every five minutes (best effort).
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
concurrency:
  group: fenice-one-global-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repository secret scan (same gate as Production CI)
        run: node scripts/scan-repository-secrets.mjs
      - run: node scripts/test-fenice-one-global-registry.mjs
      - run: node scripts/test-fenice-one-global-world-hints.mjs
      - run: node scripts/test-fenice-one-global-instrument.mjs
      - run: node scripts/test-fenice-one-global-calendar.mjs
      - run: node scripts/test-fenice-one-global-ledger.mjs
      - run: node scripts/test-fenice-one-global-accounting.mjs
      - run: node scripts/test-fenice-one-global-durable-ledger.mjs
      - run: node scripts/test-fenice-one-global-durable-shadow.mjs
      - run: node scripts/test-fenice-one-global-pipeline.mjs
      - run: node scripts/test-fenice-one-global-fx.mjs
      - run: node scripts/test-fenice-one-global-ecb-fx.mjs
      - run: node scripts/test-fenice-one-global-evidence-bundle.mjs
      - run: node scripts/test-fenice-one-global-paired-snapshot.mjs
      - run: node scripts/test-fenice-one-global-paired-store.mjs
      - run: node scripts/test-fenice-one-global-paired-diagnosis.mjs
      - run: node scripts/test-fenice-one-global-paired-paper-gate.mjs
      - run: node scripts/test-fenice-one-global-paired-shadow-runner.mjs
      - run: node scripts/test-fenice-one-global-quote-provider.mjs
      - run: node scripts/test-fenice-one-global-twelve-data-source.mjs
      - run: node scripts/test-fenice-one-global-provider-probe.mjs
      - run: node scripts/test-fenice-one-global-readiness-audit.mjs
      - name: V6 Twelve Data operational safety and bottleneck regression
        run: |
          node scripts/test-paper-bottleneck-causes.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { validateFxTimestamp } from './lib/trading/paper-fx-timestamp.mjs';
          import { prioritizeMissingSecondSource } from './lib/trading/paper-quote-probe-priority.mjs';
          const now = Date.parse('2026-11-07T12:00:00Z');
          assert.equal(validateFxTimestamp(now / 1000 + 60, now).reason, 'FUTURE_TIMESTAMP');
          assert.equal(validateFxTimestamp(now / 1000 - 180, now).reason, 'STALE_TIMESTAMP');
          const candidates = [{ symbol: 'AAA' }, { symbol: 'BBB' }];
          const observations = [{ symbol: 'BBB', sourceFamily: 'alpaca', eligibility: 'PAPER', observedAt: new Date(now).toISOString() }];
          assert.equal(prioritizeMissingSecondSource(candidates, observations, now)[0].symbol, 'BBB');
          const operational = readFileSync('scripts/refresh-twelve-data-batch-evidence-enhanced.mjs', 'utf8');
          assert.match(operational, /validateFxTimestamp\s*\(/, 'Operational FX refresh must invoke future-time guard');
          assert.match(operational, /prioritizeMissingSecondSource\s*\(/, 'Operational refresh must prioritize independent quote quorum');
          // Keep the V6 frozen blobs byte-for-byte unchanged, not just a green alias.
          const { execFileSync } = await import('node:child_process');
          const frozenBlobs = {
            'package.json': 'a34ec63743d745ec1e4b6d566e3a5e2eb74ec7fd',
            'scripts/refresh-twelve-data-batch-evidence.mjs': 'f3d6cfed10da17bddba70b5f74097b092eb9d57d',
          };
          for (const [file, expected] of Object.entries(frozenBlobs)) {
            const actual = execFileSync('git', ['hash-object', file], { encoding: 'utf8' }).trim();
            assert.equal(actual, expected, `V6 frozen blob drift: ${file}`);
          }
          // Assert the improved runner is actually invoked by a workflow, not merely present.
          const smokeWorkflow = readFileSync('.github/workflows/fenice-one-global-twelve-data-enhanced-smoke.yml', 'utf8');
          assert.ok(smokeWorkflow.includes('node --experimental-strip-types scripts/refresh-twelve-data-batch-evidence-enhanced.mjs'), 'Enhanced runner must be invoked in isolated smoke');
          assert.match(smokeWorkflow, /contents: read/, 'Enhanced smoke must remain read-only');
          const validationWorkflow = readFileSync('.github/workflows/paper-validation.yml', 'utf8');
          assert.match(validationWorkflow, /run:\s*node --experimental-strip-types scripts\/refresh-twelve-data-batch-evidence\.mjs/, 'Frozen V6 workflow must retain its historical command');
          // The enhanced implementation is staged, not operational: the frozen V6 workflow
          // checks out main and cannot be redirected without a reviewed migration.
          console.log('Enhanced Twelve Data candidate tested; production activation remains blocked pending reviewed non-frozen integration');
          console.log('V6 operational Twelve Data safety and bottleneck regression: PASS');
          NODE
      - name: Generate read-only A-Z readiness diagnostics
        if: always()
        run: node scripts/audit-fenice-one-global-readiness.mjs > fenice-one-global-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fenice-one-global-readiness
          path: fenice-one-global-readiness.json
          retention-days: 14

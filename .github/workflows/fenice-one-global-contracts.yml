name: Fenice ONE GLOBAL Contract Tests
on:
  pull_request:
    paths:
      - "lib/global/**"
      - "scripts/test-fenice-one-global-registry.mjs"
      - ".github/workflows/fenice-one-global-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test-fenice-one-global-registry.mjs

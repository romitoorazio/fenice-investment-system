name: Fenice PAPER Probe Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/paper-probe-regression.yml"
      - ".github/workflows/paper-probe-staging.yml"
      - "scripts/paper-validation-stager.mjs"
      - "scripts/stage-paper-validation-order.mjs"
      - "scripts/test-paper-validation-stager.mjs"
      - "data/paper-validation-approval.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-probe-regression.yml"
      - ".github/workflows/paper-probe-staging.yml"
      - "scripts/paper-validation-stager.mjs"
      - "scripts/stage-paper-validation-order.mjs"
      - "scripts/test-paper-validation-stager.mjs"
      - "data/paper-validation-approval.json"

permissions:
  contents: read

concurrency:
  group: fenice-paper-probe-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-probe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test PAPER validation stager fail-closed rules
        run: node scripts/test-paper-validation-stager.mjs

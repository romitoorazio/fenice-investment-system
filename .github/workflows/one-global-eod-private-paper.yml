  schedule:
    # After Europe/US close and following existing worldwide EOD research.
    - cron: "15 0 * * 2-6"
    # Australia/Japan, Hong Kong/Singapore, Europe; the strict engine checks
    # original independently evidenced sessions, never a weekday assumption.
    - cron: "20 7 * * 1-5"
    - cron: "35 8 * * 1-5"
    # Three primary opportunities inside the November Europe/Rome postclose
    # window (18:15, 19:15, 20:15 CET). A transient first fetch must not lose
    # the only forward SIGNAL opportunity. The in-process calendar/window
    # and journal CAS still reject holidays, late slots and duplicates.
    - cron: "15 17-19 * * 1-5"
    # Off-minute EU recovery through the same protected OIDC/CAS workflow.
    # The engine still requires next-session evidence and forbids duplicates.
    - cron: "41 17-18 * * 1-5"
    # 16:45 New York throughout EST/EDT without using the owner's PC.
    # The in-process NY clock rejects the unwanted UTC slot.
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
    # Bounded second USA post-close attempt, including EST/EDT transitions.
    # One slot is pre-close in winter and is rejected by the EXISTING NY
    # engine window; both are the same trusted OIDC/immutable-CAS writer.
    # This neither extends the 48h receipt deadline nor admits stale quotes.
    - cron: "15 21-22 * * 1-5"
  workflow_dispatch:
  workflow_run:
    # Independent late-night fallback: existing EOD research runs at 23:40Z.
    # Its successful completion retries settlement for an already pending
    # SIGNAL without reading its artifacts or relaxing the strict 48h window.
    # Independent DIRECT scheduled jobs improve delivery resilience without
    # launching extra schedules: hourly CI, Foundation and unified PAPER audit.
    # All scheduled backups require scheduled origin, main repo and strict EOD preflight.
    # World Market Collection is already hourly; its *scheduled* success only
    # retries the ORIGINAL OIDC/CAS writer inside the same EOD time windows.
    workflows: ["Fenice Production Deploy", "Fenice World V7 EOD Research", "Fenice Production CI", "Fenice Foundation", "Fenice ONE GLOBAL — Unified PAPER Evidence", "Fenice World Market Collection"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fenice-one-global-eod-public-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: one-global-eod-regression
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate bounded EU recovery and protected OIDC-only settlement
        run: node scripts/test-one-global-cloud-fallback-schedule.mjs
      - name: Test prospective EOD signals and private simulation accounting
        run: node scripts/test-one-global-eod-paper.mjs
      - name: Test safe worldwide metadata and private path guards
        run: |
          node scripts/test-one-global-eod-readiness.mjs
          node scripts/test-one-global-eod-private-auto-cancel.mjs
      - name: Verify all worldwide market windows and no-trade gates
        run: node scripts/test-one-global-eod-open-preflight.mjs
      - name: Verify the first CBA prospective signal hash and no fills
        run: node scripts/test-one-global-first-paper-signal.mjs
      - name: Validate CBA and XMIL prospective EOD pilot signal timing safeguards
        run: |
          node scripts/test-one-global-eod-pilot-time-audit.mjs
          node scripts/test-one-global-eod-private-auto-cancel.mjs
          node scripts/audit-one-global-eod-pilot-time.mjs
      - name: Ensure simultaneous private PAPER fills never overwrite each other
        run: node scripts/test-one-global-eod-private-store.mjs
      - name: Verify official ECB AUD per EUR conversion and source protections
        run: node scripts/test-one-global-ecb-aud.mjs
      - name: Validate free global CSV/ZIP intake without broker, PAPER or source licensing escalation
        run: |
          node scripts/test-one-global-free-world-file.mjs
          node scripts/test-one-global-first-paper-dual-eod.mjs
          node scripts/test-one-global-observed-paper.mjs
          node scripts/test-one-global-postclose-signal.mjs
          node scripts/test-one-global-private-eod-autopilot.mjs
          node scripts/test-private-eod-autopilot-installer.mjs
          node scripts/test-one-global-cloud-eod-research.mjs
          node scripts/test-one-global-cloud-private-ledger.mjs
          node scripts/test-one-global-vercel-private-blob-store.mjs
          node scripts/test-one-global-cloud-private-status.mjs
          node scripts/test-one-global-private-forensic-audit.mjs
          node scripts/test-one-global-private-roundtrip-audit.mjs
          node scripts/test-one-global-cloud-private-recovery.mjs
          node scripts/test-one-global-private-signal-expiry.mjs
          node scripts/test-one-global-asx-cba-dual-eod-research.mjs
          node scripts/test-one-global-cloud-prospective-cycle.mjs
          node scripts/test-one-global-cloud-workflow-auth.mjs
          node scripts/test-one-global-cloud-dual-eod-fetch.mjs
          node scripts/test-one-global-cloud-settlement.mjs
          node scripts/test-one-global-alpaca-sip-eod.mjs
          node scripts/test-one-global-alpaca-iex-eod.mjs
          node scripts/test-one-global-eu-delayed-eod.mjs
          node scripts/test-one-global-eu-research-screen.mjs
          node scripts/test-one-global-cloud-source-access.mjs
          node scripts/test-one-global-cloud-us-admissibility.mjs
          node scripts/test-one-global-us-owner-mapping.mjs
          node scripts/test-one-global-technical-review.mjs
          node scripts/test-one-global-private-version-cas.mjs
          node scripts/test-one-global-cloud-cycle-report.mjs
          node scripts/test-one-global-cloud-fallback-schedule.mjs
          node scripts/test-one-global-hourly-ci-recovery.mjs
          node scripts/test-one-global-private-input-intake.mjs
          node --experimental-strip-types scripts/test-fenice-owner-session.mjs
      - name: Scan for accidentally committed credentials
        run: node scripts/scan-repository-secrets.mjs

  cloud-original-private-signal-cycle:
    # Only this job gets a short-lived GitHub identity. Vendor keys and the
    # owner session stay in Vercel; PRs never acquire a journal-write identity.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.name == 'Fenice Production Deploy' ||
         github.event.workflow_run.name == 'Fenice World V7 EOD Research' ||
         ((github.event.workflow_run.name == 'Fenice Production CI' ||
           github.event.workflow_run.name == 'Fenice Foundation' ||
           github.event.workflow_run.name == 'Fenice ONE GLOBAL — Unified PAPER Evidence' ||
           github.event.workflow_run.name == 'Fenice World Market Collection') &&
          github.event.workflow_run.event == 'schedule'))))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Bound scheduled independent recovery to existing exchange-local postclose windows
        id: ci_recovery
        env:
          FENICE_WORKFLOW_EVENT: ${{ github.event_name }}
          FENICE_UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
          FENICE_UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
        run: node scripts/check-one-global-hourly-ci-recovery.mjs
      - name: Verify original private journal, settle admissible PAPER and run bounded research
        if: steps.ci_recovery.outputs.should_invoke == 'true'
        run: node scripts/invoke-one-global-cloud-signal-cycle.mjs

  cloud-asx-cba-next-session:
    # Historical 13 Nov CBA evidence window expired. Keep explicit replay
    # available without starting a keyed historical probe on new market days.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Compare actual CBA AU EOD vendor rows without prices in public logs
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          SAFE_REPORT: ${{ runner.temp }}/fenice-cba-next-eod-status.json
        run: |
          node scripts/probe-one-global-asx-cba-eod.mjs --output="$SAFE_REPORT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync(process.env.SAFE_REPORT,'utf8'));

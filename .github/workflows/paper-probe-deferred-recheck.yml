name: Fenice PAPER Deferred Recheck Regression

on:
  pull_request:
    paths:
      - ".github/workflows/paper-probe-operator-trigger.yml"
      - ".github/workflows/paper-probe-deferred-recheck.yml"
      - "scripts/paper-probe-deferred-recheck.mjs"
      - "scripts/test-paper-probe-deferred-recheck.mjs"
      - "scripts/test-paper-probe-deferred-workflow.mjs"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test bounded deferred cooldown policy
        run: node scripts/test-paper-probe-deferred-recheck.mjs

      - name: Test workflow isolation and V6 fingerprint boundary
        run: node scripts/test-paper-probe-deferred-workflow.mjs

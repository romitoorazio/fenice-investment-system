name: Fenice Engineering Validation Evidence

on:
  workflow_run:
    workflows: ["Fenice Production CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: fenice-engineering-validation-evidence
  cancel-in-progress: false

jobs:
  persist:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'data: record engineering validation evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Confirm tested code still matches main
        id: applicability
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if ! git merge-base --is-ancestor "$TESTED_SHA" HEAD; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Tested revision is no longer an ancestor of main; a newer CI run must certify it."
            exit 0
          fi
          if git diff --quiet "$TESTED_SHA"..HEAD -- . ':(exclude)data/**' ':(exclude)**/*.md'; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Code changed after the tested revision; refusing to publish stale engineering evidence."
          fi

      - name: Skip repeated evidence commits for unchanged tested code
        if: steps.applicability.outputs.eligible == 'true'
        id: publication
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/decide-engineering-evidence-publication.mjs >> "$GITHUB_OUTPUT"

      - name: Write fail-closed engineering evidence
        if: steps.applicability.outputs.eligible == 'true' && steps.publication.outputs.publish == 'true'
        env:
          CI_VALIDATED_AT: ${{ github.event.workflow_run.updated_at }}
          CI_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          CI_TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          CI_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node --experimental-strip-types scripts/write-engineering-validation-evidence.mjs

      - name: Persist evidence only
        if: steps.applicability.outputs.eligible == 'true' && steps.publication.outputs.publish == 'true'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "fenice-engineering-evidence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Foundation, V7 and Terminal can push new DATA revisions while
          # this CI attestation is being prepared. Never force-push and never
          # discard their commits: regenerate the one evidence-only commit
          # against the latest main with a tightly bounded retry.
          generated_dir="$(mktemp -d)"
          trap 'rm -rf "$generated_dir"' EXIT
          cp data/engineering-validation-evidence.json "$generated_dir/evidence.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # The original main CI cannot certify a newer code revision.
            # Data-only and documentation-only pushes may safely be rebased.
            if ! git merge-base --is-ancestor "$TESTED_SHA" HEAD; then
              echo "::warning::Tested CI commit is no longer on main. Fresh CI evidence required."
              exit 0
            fi
            if ! git diff --quiet "$TESTED_SHA"..HEAD -- . ':(exclude)data/**' ':(exclude)**/*.md'; then
              echo "::warning::Code changed since successful CI; waiting for the newer CI run."
              exit 0
            fi

            # Another writer may have already published equally current
            # evidence; do not overwrite it with an older CI attestation.
            decision="$(node scripts/decide-engineering-evidence-publication.mjs)"
            if [[ "$decision" != "publish=true" ]]; then
              if [[ "$decision" == "publish=false" ]]; then
                echo "Newer or equivalent CI evidence is already sufficiently fresh."
                exit 0
              fi
              echo "::error::Unrecognized engineering evidence publication decision."
              exit 1
            fi

            cp "$generated_dir/evidence.json" data/engineering-validation-evidence.json
            git add data/engineering-validation-evidence.json
            if git diff --cached --quiet; then
              echo "Engineering evidence is already current."
              exit 0
            fi
            git commit -m "data: record engineering validation evidence"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Concurrent data push; retrying guarded evidence publication ($attempt/3)."
            sleep $((attempt * 2))
          done

          echo "::error::Unable to publish engineering validation evidence after 3 safe attempts."
          exit 1

  # Read-only incident evidence: do not execute code from a failed workflow.
  triage_failed_ci:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record failed CI job and step evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ && "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # The jobs endpoint is scoped to this exact attempt, not a later retry.
          # No checkout, full logs, artifact execution, repository writes or broker access.
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" |
            jq -e '
              if type != "array" or length == 0 or any(.[]; (.jobs | type) != "array")
                then error("CI_JOB_METADATA_UNAVAILABLE") else . end
              | [.[].jobs[]]
              | if length == 0 then error("CI_JOB_METADATA_EMPTY") else . end
              | map(select(.conclusion == "failure" or .conclusion == "timed_out"))
              | if length == 0 then error("NO_FAILED_JOB_EVIDENCE") else . end
              | if any(.[]; (.id | type) != "number" or (.id <= 0) or (.id != (.id|floor))) then error("INVALID_JOB_ID") else . end
              | if any(.[]; (.steps // []) | type != "array") then error("INVALID_STEP_METADATA") else . end
              | if any(.[]; any((.steps // [])[]; (.conclusion == "failure" or .conclusion == "timed_out") and ((.number|type) != "number" or (.number <= 0) or (.number != (.number|floor))))) then error("INVALID_STEP_ID") else . end
              | map({jobId: (.id | numbers), conclusion,
                failedSteps: [(.steps // [])[] | select(.conclusion == "failure" or .conclusion == "timed_out")
                  | {number: (.number | numbers), conclusion}]})
              ' > "$RUNNER_TEMP/fenice-ci-failure.json"
          {
            echo "## CI incident evidence — diagnostic only"
            printf 'Source run %s, attempt %s, tested SHA %s.\n\n' "$RUN_ID" "$RUN_ATTEMPT" "$TESTED_SHA"
            echo 'Failed job and step identifiers (no names or raw logs):'
            echo '```json'
            cat "$RUNNER_TEMP/fenice-ci-failure.json"
            echo '```'
            echo 'Incident capture is best-effort (workflow concurrency may supersede pending runs). Root cause and repair are NOT verified. Review exact job logs in GitHub with authorized access; reproduce in an isolated branch and require independent review.'
            echo 'No retry, write, deployment, PAPER or LIVE authority granted.'
          } >> "$GITHUB_STEP_SUMMARY"

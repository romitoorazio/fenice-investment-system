name: Fenice PAPER Early Validation Trigger

on:
  schedule:
    # First attempt five minutes after the regular US equity open while US
    # daylight-saving time is active. During US standard time this attempt is
    # intentionally harmless because the canonical Alpaca market clock fails closed.
    - cron: "35 13 * * 1-5"
    # Year-round fallback five minutes after the standard-time US open. It is
    # skipped only when today's evidence is final rather than PRE_OPEN.
    - cron: "35 14 * * 1-5"
    # Late fallback handles transient provider/API failures without duplicating
    # a successful OPEN or final market-closed evidence day.
    - cron: "35 16 * * 1-5"
    # Registration/recovery fallback. This intentionally performs only the
    # lightweight dispatch-policy read when final evidence already exists; it
    # does not call market-data providers or dispatch the canonical workflow.
    - cron: "5 17 * * 1-5"
    # GitHub occasionally omits the canonical weekend schedule entirely. These
    # guarded recovery checkpoints only read the dispatch policy first: they
    # dispatch at most one canonical run when today's final CLOSED evidence is
    # absent, and suppress themselves when a canonical run is already active.
    - cron: "5 17 * * 0,6"
    - cron: "5 19 * * 0,6"
    - cron: "35 19 * * 0,6"
  workflow_run:
    workflows:
      - "Fenice Global Sources"
      - "Fenice Foundation"
      - "Fenice World Terminal"
      - "Fenice Autonomous Analysis"
      - "Fenice Production CI"
    types: [completed]
  workflow_dispatch:
  # GitHub can omit a scheduled dispatcher run. A completed canonical probe is
  # already constrained by the operator market window, so use it as an
  # event-driven recovery signal. The dispatch policy below still suppresses
  # duplicates and days with final safe evidence.
  workflow_run:
    workflows: ["Fenice PAPER Validation Probe Cycle"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: fenice-paper-validation-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dispatch policy
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Gate event-driven daily-evidence recovery
        id: event_recovery
        if: github.event_name == 'workflow_run'
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node scripts/paper-validation-event-recovery-trigger.mjs --github-output "$GITHUB_OUTPUT"

      - name: Check final evidence and active canonical runs
        id: today
        if: github.event_name != 'workflow_run' || steps.event_recovery.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          campaign_file="$RUNNER_TEMP/paper-campaign.json"
          session_file="$RUNNER_TEMP/paper-market-session.json"
          runs_file="$RUNNER_TEMP/paper-validation-runs.json"

          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-validation-campaign.json?ref=main" > "$campaign_file"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/data/paper-market-session.json?ref=main" > "$session_file"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow paper-validation.yml --branch main --limit 100 --json databaseId,status,conclusion,event,headBranch,createdAt,displayTitle > "$runs_file"

          node scripts/check-paper-validation-dispatch.mjs \
            --campaign "$campaign_file" \
            --market-session "$session_file" \
            --workflow-runs "$runs_file" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch canonical PAPER validation
        if: (github.event_name != 'workflow_run' || steps.event_recovery.outputs.allowed == 'true') && steps.today.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_token="early-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run paper-validation.yml --repo "$GITHUB_REPOSITORY" --ref main -f dispatch_token="$dispatch_token"
          echo "Canonical PAPER validation dispatched with correlation token $dispatch_token. LIVE and broker connectivity remain unchanged."

      - name: Confirm duplicate-day suppression
        if: (github.event_name != 'workflow_run' || steps.event_recovery.outputs.allowed == 'true') && steps.today.outputs.should_dispatch != 'true'
        run: echo "PAPER validation not dispatched; finalEvidence=${{ steps.today.outputs.already_recorded }}, activeRun=${{ steps.today.outputs.active_run }}, sessionPhase=${{ steps.today.outputs.session_phase }}."

      - name: Confirm event recovery suppression
        if: github.event_name == 'workflow_run' && steps.event_recovery.outputs.allowed != 'true'
        run: echo "Event-driven PAPER evidence recovery suppressed; reason=${{ steps.event_recovery.outputs.reason }}."

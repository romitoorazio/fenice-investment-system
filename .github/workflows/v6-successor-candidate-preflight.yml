name: Fenice V6 Successor Candidate Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/prepare-v6-successor-candidate.mjs"
      - "data/paper-validation-campaign.json"
      - "data/paper-history/v6-20260925-campaign.json"
      - "data/paper-oms-state.json"
      - ".github/workflows/v6-successor-candidate-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check prospective candidate is not activated
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-v6-successor-candidate.mjs > /tmp/fenice-successor-candidate.json
          cp data/paper-history/v6-20260925-campaign.json /tmp/fenice-v6-archive-backup.json
          printf 'TAMPER' >> data/paper-history/v6-20260925-campaign.json
          if node scripts/prepare-v6-successor-candidate.mjs > /tmp/fenice-tamper-candidate.json 2>/tmp/fenice-tamper-error; then
            echo "ERROR: tampered V6 archive was accepted"
            exit 1
          fi
          grep -q HISTORICAL_V6_ARCHIVE_MISMATCH /tmp/fenice-tamper-error
          rm data/paper-history/v6-20260925-campaign.json
          if node scripts/prepare-v6-successor-candidate.mjs > /tmp/fenice-missing-candidate.json 2>/tmp/fenice-missing-error; then
            echo "ERROR: missing V6 archive was accepted"
            exit 1
          fi
          grep -q ENOENT /tmp/fenice-missing-error
          mv /tmp/fenice-v6-archive-backup.json data/paper-history/v6-20260925-campaign.json
          node -e '
            const fs=require("node:fs");
            const c=JSON.parse(fs.readFileSync("/tmp/fenice-successor-candidate.json","utf8"));
            if(c.kind!=="PAPER_V6_SUCCESSOR_CANDIDATE_NOT_ACTIVATED") process.exit(1);
            if(c.historicalCampaign.records!==42 || c.liveTradingAllowed!==false || c.brokerConnectivityAllowed!==false) process.exit(1);
            if(c.candidate.startedAt!==null || c.candidate.approved!==false || c.candidate.certified!==false || c.candidate.dailyEvidence.length!==0) process.exit(1);
            if(c.candidate.baselineFingerprint.complete!==true || c.candidate.baselineFingerprint.files.length!==92) process.exit(1);
            console.log("PASS: candidate prepared without activation, certification, broker connectivity, or history reset");
          '

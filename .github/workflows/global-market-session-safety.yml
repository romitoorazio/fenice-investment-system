name: Fenice Global Market Session Safety

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/global-market-session-safety.yml"
      - "lib/market/venue-session-intelligence.ts"
      - "app/api/market/sessions/route.ts"
      - "app/api/trading/readiness/route.ts"
      - "app/mercati/page.tsx"
      - "app/readiness/page.tsx"
      - "app/page.tsx"
      - "scripts/test-venue-session-intelligence.mjs"
      - "scripts/test-nasdaq-public-market-status.mjs"
      - "lib/market/alpaca-paper-clock-runtime.mjs"
      - "lib/market/alpaca-paper-clock-runtime.d.mts"
      - "scripts/test-alpaca-paper-clock-runtime.mjs"
      - "lib/market/nasdaq-public-market-status.mjs"
      - "lib/market/nasdaq-public-market-status.d.mts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-market-session-safety.yml"
      - "lib/market/venue-session-intelligence.ts"
      - "app/api/market/sessions/route.ts"
      - "app/api/trading/readiness/route.ts"
      - "app/mercati/page.tsx"
      - "app/readiness/page.tsx"
      - "app/page.tsx"
      - "scripts/test-venue-session-intelligence.mjs"
      - "scripts/test-nasdaq-public-market-status.mjs"
      - "lib/market/alpaca-paper-clock-runtime.mjs"
      - "lib/market/alpaca-paper-clock-runtime.d.mts"
      - "scripts/test-alpaca-paper-clock-runtime.mjs"
      - "lib/market/nasdaq-public-market-status.mjs"
      - "lib/market/nasdaq-public-market-status.d.mts"

permissions:
  contents: read

jobs:
  global-market-session-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test authoritative session and research-only routing
        run: node --experimental-strip-types scripts/test-venue-session-intelligence.mjs
      - name: Test public Nasdaq status freshness and advisory safety
        run: node scripts/test-nasdaq-public-market-status.mjs
      - name: Test server-only Alpaca PAPER clock and fail-closed readiness
        run: node --experimental-strip-types scripts/test-alpaca-paper-clock-runtime.mjs

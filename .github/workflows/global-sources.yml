name: Fenice Global Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/check-global-sources.mjs"
      - "data/global-source-registry.json"
      - ".github/workflows/global-sources.yml"

permissions:
  contents: write

concurrency:
  # Shared by Fenice data writers: serialize commits to main and avoid overwriting generated datasets.
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check authoritative global sources
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run sources:check

      - name: Enforce production source health gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('data/global-source-health.json', 'utf8'));
          if (!Array.isArray(h.sources) || !Number.isFinite(h.qualityScore) || !h.gate) {
            throw new Error('Invalid global source health report');
          }
          if (!['GREEN', 'AMBER', 'RED'].includes(h.gate)) {
            throw new Error(`Unknown source gate: ${h.gate}`);
          }
          const failures = Array.isArray(h.critical?.failures) ? h.critical.failures : [];
          const criticalReady = Number(h.critical?.ready || 0);
          const criticalTotal = Number(h.critical?.total || 0);
          const unconfiguredCritical = h.sources.filter(source => source.critical && source.status === 'unconfigured').map(source => source.id);
          console.log('Source gate', h.gate, 'quality', h.qualityScore, 'critical', `${criticalReady}/${criticalTotal}`, 'failures', failures.join(',') || 'none');

          if (unconfiguredCritical.length > 0) {
            throw new Error(`Critical source configuration missing: ${unconfiguredCritical.join(',')}`);
          }
          if (h.gate === 'RED') {
            throw new Error(`Fenice production source gate RED: quality=${h.qualityScore}, critical=${criticalReady}/${criticalTotal}, failures=${failures.join(',') || 'none'}`);
          }
          if (h.gate === 'AMBER') {
            console.log(`::warning::Fenice source gate AMBER: quality=${h.qualityScore}, critical=${criticalReady}/${criticalTotal}, failures=${failures.join(',') || 'none'}`);
          }
          NODE

      - name: Guard persisted source data from secrets
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const secretValues = [
            process.env.ALPHA_VANTAGE_API_KEY,
            process.env.FRED_API_KEY,
            process.env.COINGECKO_API_KEY,
            process.env.EIA_API_KEY,
          ].filter(Boolean);
          const sensitiveKeys = new Set(['api_key', 'apikey', 'key', 'token', 'access_token']);
          const files = ['data/global-source-health.json'];
          if (fs.existsSync('data/source-history')) {
            for (const name of fs.readdirSync('data/source-history')) {
              if (name.endsWith('.json')) files.push(path.join('data/source-history', name));
            }
          }

          function inspect(value) {
            if (typeof value === 'string') {
              for (const secret of secretValues) {
                if (value.includes(secret) || value.includes(encodeURIComponent(secret))) {
                  throw new Error('Persisted source data contains a configured secret');
                }
              }
              try {
                const url = new URL(value);
                for (const key of sensitiveKeys) {
                  if (url.searchParams.has(key) && url.searchParams.get(key) !== 'REDACTED') {
                    throw new Error('Persisted source endpoint contains an unredacted sensitive query parameter');
                  }
                }
              } catch (error) {
                if (error instanceof TypeError) return;
                throw error;
              }
              return;
            }
            if (Array.isArray(value)) {
              for (const item of value) inspect(item);
              return;
            }
            if (value && typeof value === 'object') {
              for (const item of Object.values(value)) inspect(item);
            }
          }

          for (const file of files) inspect(JSON.parse(fs.readFileSync(file, 'utf8')));
          console.log(`Secret persistence guard passed for ${files.length} source-health file(s)`);
          NODE

      - name: Commit source health data
        run: |
          git config user.name "fenice-source-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          cp data/global-source-health.json "$generated_dir/global-source-health.json"
          mkdir -p "$generated_dir/source-history"
          cp -a data/source-history/. "$generated_dir/source-history/" 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/global-source-health.json" data/global-source-health.json
            rm -rf data/source-history
            mkdir -p data/source-history
            cp -a "$generated_dir/source-history/." data/source-history/ 2>/dev/null || true
            git add -A -- data/global-source-health.json data/source-history

            if git diff --cached --quiet; then
              echo "No source health changes"
              exit 0
            fi

            git commit -m "Update global source health"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish source health after 3 attempts"
          exit 1

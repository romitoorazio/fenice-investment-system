name: Fenice Global Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/check-global-sources.mjs"
      - "scripts/sanitize-source-health.mjs"
      - "data/global-source-registry.json"
      - ".github/workflows/global-sources.yml"

permissions:
  contents: write

concurrency:
  group: fenice-data-writer
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check authoritative global sources
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: npm run sources:check

      - name: Sanitize persisted source metadata
        run: node scripts/sanitize-source-health.mjs

      - name: Validate source health gate
        run: |
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('data/global-source-health.json'));if(!Array.isArray(h.sources)||!Number.isFinite(h.qualityScore)||!h.gate)process.exit(1);if(!['GREEN','AMBER','RED'].includes(h.gate))process.exit(1);const leak=(h.sources||[]).some(s=>/[?&](?:api[_-]?key|key|token|access[_-]?token|secret|password)=(?!%5BREDACTED%5D|\[REDACTED\])/i.test(String(s.endpointUsed||'')));if(leak)process.exit(1);console.log('Source gate',h.gate,'quality',h.qualityScore,'healthy',h.summary?.healthy,'failed',h.summary?.failed,'unconfigured',h.summary?.unconfigured)"

      - name: Commit source health data
        run: |
          git config user.name "fenice-source-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          cp data/global-source-health.json "$generated_dir/global-source-health.json"
          mkdir -p "$generated_dir/source-history"
          cp -a data/source-history/. "$generated_dir/source-history/" 2>/dev/null || true

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/global-source-health.json" data/global-source-health.json
            mkdir -p data/source-history
            cp -a "$generated_dir/source-history/." data/source-history/ 2>/dev/null || true
            git add data/global-source-health.json data/source-history

            if git diff --cached --quiet; then
              echo "No source health changes"
              exit 0
            fi

            git commit -m "Update global source health"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done

          echo "Unable to publish source health after 3 attempts"
          exit 1
